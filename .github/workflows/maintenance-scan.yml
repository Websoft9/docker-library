# Twice-weekly scan selector.
#
# Cron uses UTC. Monday and Thursday 02:00 UTC is 10:00 China Standard Time.
#
# Scans only the apps whose cadence interval has elapsed since their last
# successful check. State lives in the MAINTENANCE_SCAN_STATE repository
# variable as JSON, so scanning never creates repository commits.
#
# The state is updated through the variables REST API, which the automatic
# GITHUB_TOKEN cannot call. Use one PAT secret with repo scope (or Variables
# read/write). Reading through the `vars` context would not need a token, but
# the API is used so a read failure is distinguishable from "no state yet".
#
# Due rules:
# - interval comes from metadata/maintenance.yaml: weekly=7d, monthly=30d, quarterly=90d
# - never checked: deterministic hash slot spreads the first run across the cycle
# - failed checks retry on the next run; after 3 failures the app is parked
# - --limit caps the per-run scan volume

name: Maintenance scan

on:
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum apps to scan in this run
        required: false
        default: '15'
        type: string
      plan_only:
        description: List due apps without scanning upstream
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-scan
  cancel-in-progress: false

env:
  STATE_VAR: MAINTENANCE_SCAN_STATE
  STATE_LIMIT_BYTES: '45000'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install libs CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e 'cli/'

      - name: Read scan state
        id: state
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_STATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set MAINTENANCE_STATE_TOKEN to a PAT with repo scope (the automatic GITHUB_TOKEN cannot write variables)."
            exit 1
          fi
          if gh api "repos/$REPO/actions/variables/$STATE_VAR" --jq .value > state.json 2> gh.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "loaded existing state ($(wc -c < state.json) bytes)"
          elif grep -q 'HTTP 404' gh.err; then
            printf '%s' '{"version":1,"apps":{}}' > state.json
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no state variable yet; starting empty"
          else
            cat gh.err >&2
            echo "::error::Failed to read $STATE_VAR"
            exit 1
          fi
          python -c 'import json; json.load(open("state.json"))' || {
            echo "::error::$STATE_VAR is not valid JSON; refusing to scan"
            exit 1
          }

      - name: Select and scan due apps
        id: scan
        env:
          LIMIT: ${{ inputs.limit || '15' }}
          PLAN_ONLY: ${{ inputs.plan_only || 'false' }}
        run: |
          set -euo pipefail
          # The CLI budget is total, not per app, so scale it with the batch.
          budget=$(( LIMIT * 20 ))
          if [ "$budget" -lt 120 ]; then budget=120; fi
          if [ "$budget" -gt 1500 ]; then budget=1500; fi
          args=(scan --selection due --state-file state.json --limit "$LIMIT" --network-timeout "$budget" --json)
          if [ "$PLAN_ONLY" = "true" ]; then
            args+=(--plan-only)
          else
            args+=(--state-out next.json)
          fi
          python -m libs "${args[@]}" > scan.json

      - name: Write job summary
        if: steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          from libs.scan_state import MAX_FAILS

          items = json.load(open("scan.json"))
          state_path = Path("next.json") if Path("next.json").exists() else Path("state.json")
          state = json.load(open(state_path)) if state_path.exists() else {"apps": {}}
          parked = sorted(name for name, entry in state.get("apps", {}).items() if int(entry.get("fails") or 0) >= MAX_FAILS)

          print("## Maintenance scan")
          print()
          print(f"- scanned: {len(items)}")
          print(f"- state entries: {len(state.get('apps', {}))}")
          print(f"- needs attention: {', '.join(parked) if parked else 'none'}")
          print()
          if items:
              print("| app | current | latest | status |")
              print("| --- | --- | --- | --- |")
              for item in items:
                  latest = item.get("latest_version")
                  latest_version = latest.get("version") if isinstance(latest, dict) else "n/a"
                  current = ", ".join(
                      value for value in (item.get("current_version") or [])
                      if str(value).lower() != "latest"
                  )
                  status = item.get("version_status") or item.get("error") or "planned"
                  print(f"| {item['name']} | {current} | {latest_version} | {status} |")
          else:
              print("No apps are due in this run.")
          PY

      - name: Create scan review issue
        if: steps.scan.outcome == 'success' && inputs.plan_only != true
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          scan_date=$(date -u +%F)
          python ci/scripts/maintenance_scan_review.py render \
            --scan-file scan.json \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --scan-date "$scan_date" > review-issue.json

          python - <<'PY' > review-title.txt
          import json
          print(json.load(open("review-issue.json"))["title"])
          PY
          title=$(cat review-title.txt)

          gh api --paginate --slurp "repos/$REPO/issues?state=open&per_page=100&sort=created&direction=desc" > recent-issues.json
          existing=$(python - <<'PY'
          import json
          title = open("review-title.txt").read().strip()
          pages = json.load(open("recent-issues.json"))
          issues = [item for page in pages for item in (page if isinstance(page, list) else [page])]
          match = next((item for item in issues if "pull_request" not in item and item.get("title") == title), None)
          print(match["number"] if match else "")
          PY
          )
          if [ -n "$existing" ]; then
            issue_number="$existing"
            gh api --method PATCH "repos/$REPO/issues/$issue_number" --input review-issue.json >/dev/null
            echo "Reusing scan review issue #$issue_number"
          else
            gh api --method POST "repos/$REPO/issues" --input review-issue.json > created-issue.json
            issue_number=$(python -c 'import json; print(json.load(open("created-issue.json"))["number"])')
            echo "Created scan review issue #$issue_number"
          fi
          echo "- Owner review: https://github.com/$REPO/issues/$issue_number" >> "$GITHUB_STEP_SUMMARY"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Write updated scan state
        if: always() && steps.scan.outcome == 'success' && inputs.plan_only != true && hashFiles('next.json') != ''
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_STATE_TOKEN }}
          REPO: ${{ github.repository }}
          EXISTS: ${{ steps.state.outputs.exists }}
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          a = json.load(open("state.json"))
          b = json.load(open("next.json"))
          raise SystemExit(0 if a == b else 1)
          PY
          then
            echo "state unchanged; skipping write"
            exit 0
          fi
          bytes=$(wc -c < next.json | tr -d '[:space:]')
          if [ "$bytes" -gt "$STATE_LIMIT_BYTES" ]; then
            echo "::error::state is ${bytes} bytes, above ${STATE_LIMIT_BYTES}; shard or migrate before the next run"
            exit 1
          fi
          body=$(jq -n --arg name "$STATE_VAR" --arg value "$(cat next.json)" '{name: $name, value: $value}')
          if [ "$EXISTS" = "true" ]; then
            printf '%s' "$body" | gh api --method PATCH "repos/$REPO/actions/variables/$STATE_VAR" --input - >/dev/null
          else
            printf '%s' "$body" | gh api --method POST "repos/$REPO/actions/variables" --input - >/dev/null
          fi
          echo "wrote $STATE_VAR (${bytes} bytes)"

      - name: Notify WeCom about scan results
        if: always() && steps.scan.outcome == 'success' && inputs.plan_only != true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_ISSUE: ${{ steps.review.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "${WECOM_WEBHOOK:-}" ]; then
            echo "::warning::WECOM_WEBHOOK is not set; skipping scan notification"
            exit 0
          fi

          scan_date=$(date -u +%F)
          export SCAN_DATE="$scan_date"
          python - <<'PY' > wecom-scan.md
          import json
          import os

          items = json.load(open("scan.json", encoding="utf-8"))

          def names(predicate):
              return [item["name"] for item in items if predicate(item)]

          updates = names(lambda item: item.get("version_status") == "update-available")
          covered = names(lambda item: item.get("version_status") == "covered-by-current-minor-tag")
          undetermined = sorted(set(
              names(lambda item: item.get("version_status") == "unavailable")
              + names(lambda item: not item.get("version_status") and bool(item.get("error")))
          ))
          up_to_date = names(lambda item: item.get("version_status") == "up-to-date")

          def line(label, values, empty="none"):
              return f"> {label}: {', '.join(values) if values else empty}"

          lines = [
              f"# Maintenance scan {os.environ['SCAN_DATE']}",
              f"> Run: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']})",
              f"> Scanned: {len(items)}",
              line("Updates", updates),
              line("Covered", covered),
              line("Undetermined", undetermined),
              f"> Up to date: {len(up_to_date)}",
          ]
          review_issue = os.environ.get("REVIEW_ISSUE", "").strip()
          if review_issue:
              lines.append(f"> Review: [#{review_issue}](https://github.com/{os.environ['REPOSITORY']}/issues/{review_issue})")
          print("\n".join(lines))
          PY

          payload=$(jq -n --arg content "$(cat wecom-scan.md)" '{msgtype:"markdown",markdown:{content:$content}}')
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$WECOM_WEBHOOK" || echo '::warning::WeCom notification failed'

      - name: Notify WeCom that scan failed
        if: failure()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${WECOM_WEBHOOK:-}" ]; then
            echo "::warning::WECOM_WEBHOOK is not set; skipping failure notification"
            exit 0
          fi
          content=$(printf '# Maintenance scan failed\n> Repository: %s\n> Run: [%s](%s)\n\nPlease check the Actions logs.' \
            "$REPOSITORY" "$RUN_ID" "$RUN_URL")
          payload=$(jq -n --arg content "$content" '{msgtype:"markdown",markdown:{content:$content}}')
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$WECOM_WEBHOOK" || echo '::warning::WeCom notification failed'
