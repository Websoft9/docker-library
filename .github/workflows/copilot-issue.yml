name: Assign Copilot to AI issue

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

concurrency:
  group: copilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  assign:
    if: |
      (
        github.event.action == 'opened' &&
        contains(github.event.issue.labels.*.name, 'ai') &&
        contains(
          fromJson('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.issue.author_association
        )
      ) || (
        github.event.action == 'labeled' &&
        github.event.label.name == 'ai'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign Copilot cloud agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.MAINTENANCE_STATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set COPILOT_ASSIGN_TOKEN (preferred) or MAINTENANCE_STATE_TOKEN to a user PAT that can assign Copilot."
            exit 1
          fi

          assigned=$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json assignees \
            --jq '[.assignees[].login] | any(. == "Copilot" or . == "copilot-swe-agent[bot]")')
          if [ "$assigned" = "true" ]; then
            echo "Copilot is already assigned to #$ISSUE_NUMBER; skipping."
            exit 0
          fi

          instructions='Read AGENTS.md first. Use .github/skills/libs/SKILL.md and follow the first hidden workflow marker in the issue body. The canonical workflow documents and skills are under skills/. Work autonomously, run the repository quality gates, and let Copilot create the branch and pull request. Report risks and results in the pull request; the owner will perform E2E and manually merge it.'

          payload=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg instructions "$instructions" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: "main",
                custom_instructions: $instructions,
                custom_agent: "",
                model: ""
              }
            }')

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --input - <<< "$payload"
