name: Assign Copilot to AI issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: copilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'ai')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign Copilot cloud agent
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_STATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set MAINTENANCE_STATE_TOKEN to a user PAT that can assign Copilot."
            exit 1
          fi

          instructions='Read AGENTS.md first. Use .github/skills/libs/SKILL.md and follow the first hidden workflow marker in the issue body. The canonical workflow documents and skills are under skills/. Work autonomously, run the repository quality gates, and let Copilot create the branch and pull request.'

          payload=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg instructions "$instructions" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repo,
                base_branch: "main",
                custom_instructions: $instructions,
                custom_agent: "",
                model: ""
              }
            }')

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --input - <<< "$payload"
