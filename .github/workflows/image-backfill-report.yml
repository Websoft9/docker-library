name: Report failed image backfill

on:
  workflow_run:
    workflows: [Build image to DockerHub]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: image-backfill-report
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # workflow_run uses trusted default-branch code; never execute the backfill ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or update backfill bug
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 ci/scripts/image_backfill_report.py
