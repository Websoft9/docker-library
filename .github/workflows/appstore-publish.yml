name: Appstore Publish

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Publish channel; rc is reserved for manual pre-release use
        required: true
        type: choice
        options:
          - dev
          - rc
          - release
      from_ref:
        description: Optional git ref used to calculate apps-delta
        required: false
        type: string

jobs:
  publish:
    name: Build and publish appstore artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publish channel
        id: resolve_channel
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref_name }}" == "dev" ]]; then
              channel="dev"
            elif [[ "${{ github.ref_name }}" == "main" ]]; then
              channel="release"
            else
              echo "Unsupported push branch: ${{ github.ref_name }}" >&2
              exit 1
            fi
          else
            channel="${{ inputs.channel }}"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch catalog inputs
        env:
          CONTENTFUL_GRAPHQL_TOKEN: ${{ secrets.CONTENTFUL_GRAPHQLTOKEN }}
        run: |
          python build/fetch_catalog.py \
            --channel "${{ steps.resolve_channel.outputs.channel }}" \
            --output-dir dist/catalog-source

      - name: Check if first v2 publish (R2 apps/ prefix empty)
        id: check_seed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          count=$(aws s3 ls "s3://artifact/websoft9/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library/apps/" --recursive --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "R2 apps/ prefix is empty — first publish, will seed all app packages"
            echo "seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "R2 apps/ prefix has $count objects — incremental publish"
            echo "seed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build publish artifacts
        run: |
          args=(
            --channel "${{ steps.resolve_channel.outputs.channel }}"
            --output-dir dist/appstore-publish
            --catalog-source-dir dist/catalog-source
          )
          if [[ "${{ steps.check_seed.outputs.seed }}" == "true" ]]; then
            args+=(--all-apps)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.from_ref }}" ]]; then
            args+=(--from-ref "${{ inputs.from_ref }}")
          fi
          python build/library_publish.py "${args[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore-publish-${{ steps.resolve_channel.outputs.channel }}
          path: dist/appstore-publish

      - name: Upload v2 catalog to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/catalog \
            s3://artifact/websoft9/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/catalog \
            --no-delete --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload v2 library metadata to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library \
            s3://artifact/websoft9/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library \
            --exclude "apps/*" \
            --no-delete --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload v2 per-app packages to Cloudflare R2 (additive only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -d "dist/appstore-publish/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library/apps" ]; then
            aws s3 cp --recursive \
              dist/appstore-publish/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library/apps \
              s3://artifact/websoft9/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/library/apps \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi

      - name: Upload v2 manifests to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/manifests \
            s3://artifact/websoft9/v2/${{ steps.resolve_channel.outputs.channel }}/appstore/manifests \
            --no-delete --endpoint-url "$AWS_ENDPOINT_URL"