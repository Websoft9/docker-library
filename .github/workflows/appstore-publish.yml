name: Appstore Publish

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      channel:
        description: Publish dev or rc; official releases require an X.Y.Z tag on main
        required: true
        type: choice
        options:
          - dev
          - rc
      from_ref:
        description: Optional git ref used to calculate apps-delta
        required: false
        type: string

jobs:
  publish:
    name: Build and publish appstore artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.resolve_channel.outputs.channel }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve publish channel
        id: resolve_channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_TYPE" == "tag" ]]; then
              if ! [[ "$REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Official release tags must use stable X.Y.Z format (for example 0.9.0)."
                exit 1
              fi
              git fetch origin main
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "::error::Release tags must point to a commit on main."
                exit 1
              fi
              channel="release"
              version="$REF_NAME"
            elif [[ "$REF_NAME" == "main" ]]; then
              channel="dev"
            else
              echo "Unsupported push ref: $REF_TYPE $REF_NAME" >&2
              exit 1
            fi
          else
            channel="$INPUT_CHANNEL"
            if [[ "$channel" != "dev" && "$channel" != "rc" ]]; then
              echo "::error::Manual publishing supports dev and rc only; push an X.Y.Z tag for release."
              exit 1
            fi
          fi
          if [[ "$channel" != "release" ]]; then
            version="$channel-$(git rev-parse --short=12 HEAD)"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve release base
        id: release_base
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          previous=""
          while IFS= read -r tag; do
            if [[ "$tag" != "$GITHUB_REF_NAME" && "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              previous="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)
          if [ -n "$previous" ]; then
            echo "from_ref=$previous" >> "$GITHUB_OUTPUT"
          else
            echo "all_apps=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch catalog inputs
        env:
          CONTENTFUL_GRAPHQL_TOKEN: ${{ secrets.CONTENTFUL_GRAPHQLTOKEN }}
        run: |
          python ci/scripts/fetch_catalog.py \
            --channel "${{ steps.resolve_channel.outputs.channel }}" \
            --output-dir dist/catalog-source

      # ── legacy media assets (logos + screenshots, same as old media.yml) ──

      - name: Download legacy logos from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          mkdir -p dist/catalog-source/logos
          aws s3 sync \
            s3://libs/Websoft9/logo/product \
            dist/catalog-source/logos \
            --endpoint-url "$AWS_ENDPOINT_URL" || echo "Warning: logo sync failed (non-blocking)"

      - name: Download legacy screenshots from Contentful
        run: |
          mkdir -p dist/catalog-source/screenshots
          for f in dist/catalog-source/product_*.json; do
            [ -f "$f" ] || continue
            jq -r '.[].screenshots[]?.value // empty' "$f" 2>/dev/null | sort -u | while read -r url; do
              name=$(basename "$url" | cut -d'?' -f1)
              [ -z "$name" ] && name="$(echo "$url" | md5sum | cut -c1-12).png"
              [ -f "dist/catalog-source/screenshots/$name" ] || wget -q "$url" -O "dist/catalog-source/screenshots/$name" || true
            done
          done

      - name: Check if first v2 publish (R2 apps/ prefix empty)
        id: check_seed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          count=$(aws s3 ls "s3://artifact/appstore/${{ steps.resolve_channel.outputs.channel }}/library/apps/" --recursive --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "R2 apps/ prefix is empty — first publish, will seed all app packages"
            echo "seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "R2 apps/ prefix has $count objects — incremental publish"
            echo "seed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build publish artifacts
        env:
          LIBRARY_VERSION: ${{ steps.resolve_channel.outputs.version }}
          INPUT_FROM_REF: ${{ inputs.from_ref }}
          RELEASE_FROM_REF: ${{ steps.release_base.outputs.from_ref }}
        run: |
          args=(
            --channel "${{ steps.resolve_channel.outputs.channel }}"
            --output-dir dist/appstore-publish
            --catalog-source-dir dist/catalog-source
            --library-version "$LIBRARY_VERSION"
          )
          if [[ "${{ steps.check_seed.outputs.seed }}" == "true" || "${{ steps.release_base.outputs.all_apps }}" == "true" ]]; then
            args+=(--all-apps)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$INPUT_FROM_REF" ]]; then
            args+=(--from-ref "$INPUT_FROM_REF")
          elif [[ -n "$RELEASE_FROM_REF" ]]; then
            args+=(--from-ref "$RELEASE_FROM_REF")
          fi
          python ci/scripts/library_publish.py "${args[@]}"

      - name: Generate changelog
        if: steps.resolve_channel.outputs.channel == 'release'
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist/CHANGELOG_RELEASE.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: appstore-publish-${{ steps.resolve_channel.outputs.channel }}
          path: dist/appstore-publish

      - name: Upload v2 catalog to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/appstore/${{ steps.resolve_channel.outputs.channel }}/catalog \
            s3://artifact/appstore/${{ steps.resolve_channel.outputs.channel }}/catalog \
            --cache-control "public, max-age=60" \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload v2 library metadata to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/appstore/${{ steps.resolve_channel.outputs.channel }}/library \
            s3://artifact/appstore/${{ steps.resolve_channel.outputs.channel }}/library \
            --exclude "apps/*" \
            --cache-control "public, max-age=60" \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload v2 per-app packages to Cloudflare R2 (additive only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -d "dist/appstore-publish/appstore/${{ steps.resolve_channel.outputs.channel }}/library/apps" ]; then
            aws s3 cp --recursive \
              dist/appstore-publish/appstore/${{ steps.resolve_channel.outputs.channel }}/library/apps \
              s3://artifact/appstore/${{ steps.resolve_channel.outputs.channel }}/library/apps \
              --cache-control "public, max-age=60" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi

      - name: Upload v2 manifests to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/appstore/${{ steps.resolve_channel.outputs.channel }}/manifests \
            s3://artifact/appstore/${{ steps.resolve_channel.outputs.channel }}/manifests \
            --cache-control "public, max-age=60" \
            --endpoint-url "$AWS_ENDPOINT_URL"

      # ── legacy uploads (old R2 paths, kept for backward compatibility) ──

      - name: Upload legacy library to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/legacy/${{ steps.resolve_channel.outputs.channel }}/library \
            s3://artifact/${{ steps.resolve_channel.outputs.channel }}/websoft9/plugin/library \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Upload legacy media to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync \
            dist/appstore-publish/legacy/${{ steps.resolve_channel.outputs.channel }}/media \
            s3://artifact/${{ steps.resolve_channel.outputs.channel }}/websoft9/plugin/media \
            --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Resolve legacy purge URLs
        id: purge_urls
        env:
          CHANNEL: ${{ steps.resolve_channel.outputs.channel }}
        run: |
          case "$CHANNEL" in
            dev) library=library-dev.zip; media=media-dev.zip ;;
            rc) library=library-rc.zip; media=media-latest.zip ;;
            release) library=library-latest.zip; media=media-latest.zip ;;
            *) exit 1 ;;
          esac
          echo "urls=https://artifact.websoft9.com/$CHANNEL/websoft9/plugin/library/$library https://artifact.websoft9.com/$CHANNEL/websoft9/plugin/media/$media" >> "$GITHUB_OUTPUT"

      - name: Purge legacy Cloudflare Cache
        uses: NathanVaughn/actions-cloudflare-purge@v4.0.0
        with:
          cf_zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_auth: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          files: ${{ steps.purge_urls.outputs.urls }}

      - name: Create GitHub Release (release channel only)
        if: steps.resolve_channel.outputs.channel == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/appstore-publish/legacy/release/library/library.json
          tag_name: ${{ steps.resolve_channel.outputs.version }}
          name: ${{ steps.resolve_channel.outputs.version }}
          body_path: dist/CHANGELOG_RELEASE.md
          draft: false
          prerelease: false

  pages:
    name: Build Github Pages (release only)
    if: needs.publish.outputs.channel == 'release'
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
