name: i18n

on: 
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: 
      - "apps/*/.env"

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v7
      name: Check out code
      with:
        ref: main
        fetch-depth: 0

    - name: Check automation token
      env:
        TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::Set OPENCODE_GITHUB_TOKEN so i18n PRs trigger the required PR checks."
          exit 1
        fi

    - name: Update translation.json
      run: |
        echo "start to update translation.json"
        cd i18n
        pip3 install python-dotenv
        python3 create.py

    - name: Create translation PR
      uses: peter-evans/create-pull-request@v5
      with:
        # A PAT is required so the generated PR triggers the required PR checks.
        token: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        branch: update-i18n
        base: main
        delete-branch: true
        commit-message: "chore: update i18n translation keys"
        title: "chore: update i18n translation keys"
        body: "Automated update from the i18n workflow."

  pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        repository: ['Websoft9/plugin-appstore', 'Websoft9/plugin-myapps']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main    

      - name: Update languages files
        run: |
          cd public
          wget https://raw.githubusercontent.com/Websoft9/docker-library/main/i18n/translation.json
          wget https://raw.githubusercontent.com/Websoft9/docker-library/main/i18n/pr.py
          python3 pr.py translation.json po.en_US.js po.zh_CN.js
          rm -rf pr.py translation.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.ZJ_ADMIN_TOKEN }}
          branch: update-${{ matrix.repository }}-version-${{ github.run_number }}
          delete-branch: true
          commit-message: "${{ matrix.repository }} combine translation.json"
          title: "${{ matrix.repository }} combine translation.json"
          body: "${{ matrix.repository }} combine translation.json"