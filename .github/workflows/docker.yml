# Build and push custom Docker images to DockerHub.
#
# Version source of truth: docs/image-tag-spec.md.
#
# Tag namespaces (same repository, tag differs by event):
#   main push  -> dev-<git-sha> (primary) + dev-latest (rolling alias)
#                 amd64 is required; arm64 is best-effort and warns on failure
#                 final tags are assembled from digests; no temporary arch tags are published
#   published Release -> called by appstore-publish to promote exact-context candidates
#   PR candidate (workflow_call) -> dev-<pr-sha> + dev-src-<input-hash>; amd64 only; never dev-latest
#   main push -> also records dev-src-<Dockerfile-input-hash> for immutable context matching
#
# Build contract: the Dockerfile MUST declare a version ARG whose name is
# ${APP^^}_VERSION (e.g. apps/akeneo -> AKENEO_VERSION). CI reads W9_VERSION
# from apps/<app>/.env, injects it as that build-arg, and tags from W9_VERSION.
# Apps that do not declare this ARG are not built by CI; migrate them when touched.
#
# Manual runs (workflow_dispatch) target one app:
#   channel=dev     -> build dev-<sha> + dev-latest for the chosen app
#   channel=promote -> promote an exact-context candidate, or an explicit source_sha
#
# All app context changes trigger candidates, including root package/config files.
# Official promotion is invoked by appstore-publish only after Release publication.

name: Build image to DockerHub

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Published stable Release tag to promote (release promotion only)
        required: false
        type: string
      release_apps:
        description: JSON array of changed custom-image apps selected by the release plan
        required: false
        type: string
      app:
        description: Build a single app (required for PR candidate builds)
        required: false
        type: string
      pr_sha:
        description: PR head SHA to build a candidate image for
        required: false
        type: string
      tooling_sha:
        description: Trusted base commit containing the build tools for a PR
        required: false
        type: string
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      app:
        description: "App name to build or promote (e.g. strapi)"
        required: true
        type: string
      channel:
        description: "Build a dev candidate or promote an existing dev image"
        required: true
        type: choice
        options:
          - dev
          - promote
        default: dev
      source_sha:
        description: "Optional source commit SHA for promote; otherwise resolve an exact-context candidate"
        required: false
        type: string
      target_ref:
        description: Optional historical app ref to build/promote using this workflow's tooling
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.pr_sha || inputs.release_tag || inputs.target_ref || github.ref }}

    - name: Record manual backfill request
      if: github.event_name == 'workflow_dispatch' && inputs.channel == 'promote'
      env:
        BACKFILL_APP: ${{ inputs.app }}
        BACKFILL_REF: ${{ inputs.target_ref || github.ref_name }}
        BACKFILL_WORKFLOW_SHA: ${{ github.sha }}
        BACKFILL_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        python3 -c 'import json,os,subprocess; from pathlib import Path; request = {key: os.environ["BACKFILL_" + key.upper()] for key in ("app", "ref", "workflow_sha", "source_sha")}; request["sha"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); Path("backfill.json").write_text(json.dumps(request))'

    - name: Upload manual backfill request
      if: github.event_name == 'workflow_dispatch' && inputs.channel == 'promote'
      uses: actions/upload-artifact@v4
      with:
        name: image-backfill-${{ github.run_attempt }}
        path: backfill.json
        retention-days: 7

    - id: set-matrix
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_APP: ${{ inputs.app }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_APPS: ${{ inputs.release_apps }}
        PR_SHA: ${{ inputs.pr_sha }}
        BEFORE_SHA: ${{ github.event.before }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        CURRENT_SHA=$(git rev-parse HEAD)
        if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -n "${PR_SHA:-}" ]; then
          app_list="$INPUT_APP"
        elif [ -n "$RELEASE_TAG" ]; then
          if ! [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use stable X.Y.Z format"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          app_list=$(jq -r 'if type == "array" and all(.[]; type == "string") then .[] else error("release_apps must be a JSON string array") end' <<< "$RELEASE_APPS")
        else
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          else
            changed_files=$(git diff --name-only HEAD^ HEAD)
          fi
          app_list=$(printf '%s\n' "$changed_files" | awk -F/ '$1 == "apps" && NF >= 3 {print $2}' | sort -u)
        fi
        valid_list=()
        for app in $app_list; do
          if [ -z "$app" ]; then
            continue
          fi
          if ! [[ "$app" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo 'Invalid application directory' >&2
            exit 1
          fi
          if [ ! -f "apps/$app/Dockerfile" ]; then
            echo "skip (no Dockerfile): $app"
            continue
          fi
          app_upper=$(echo "$app" | tr '[:lower:]' '[:upper:]')
          version_arg="${app_upper}_VERSION"
          if ! grep -qE "^ARG[[:space:]]+${version_arg}=" "apps/$app/Dockerfile"; then
            echo "skip (no ${version_arg} ARG): $app"
            continue
          fi
          valid_list+=("$app")
        done
        if { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -n "${PR_SHA:-}" ]; } && [ "${#valid_list[@]}" -eq 0 ]; then
          echo "error: app '$INPUT_APP' is not buildable (missing Dockerfile or <APP>_VERSION ARG)" >&2
          exit 1
        fi
        app_list_json=$(jq -cn '$ARGS.positional' --args "${valid_list[@]}")
        echo "matrix={\"app\": $app_list_json}" >> "$GITHUB_OUTPUT"
        if [ "${#valid_list[@]}" -gt 0 ]; then
          echo "has_apps=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_apps=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    name: ${{ (inputs.release_tag != '' || inputs.channel == 'promote') && 'promote' || 'build' }} (${{ matrix.app }})
    needs: setup
    if: needs.setup.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    env:
      TOOLING_ROOT: ${{ github.workspace }}/tooling
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.setup.outputs.matrix)}}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ inputs.pr_sha || inputs.release_tag || inputs.target_ref || github.ref }}
        path: source
        persist-credentials: false

    - name: Checkout trusted build tooling
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tooling_sha || inputs.release_tag || github.sha }}
        path: tooling
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install minimal CLI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Resolve channel
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        PR_SHA: ${{ inputs.pr_sha }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        CURRENT_SHA=$(git rev-parse HEAD)
        echo "BUILD_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
        echo "APP=${{ matrix.app }}" >> $GITHUB_ENV
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          case "$INPUT_CHANNEL" in
            dev)
              echo "CHANNEL=dev" >> $GITHUB_ENV
              echo "SOURCE_SHA=" >> $GITHUB_ENV
              ;;
            promote)
              source_sha="${INPUT_SOURCE_SHA:-$CURRENT_SHA}"
              echo "CHANNEL=promote" >> $GITHUB_ENV
              echo "SOURCE_SHA=$source_sha" >> $GITHUB_ENV
              ;;
            *)
              echo "error: unsupported manual channel '$INPUT_CHANNEL'" >&2
              exit 1
              ;;
          esac
        elif [ -n "${PR_SHA:-}" ]; then
          # PR candidate: never moves dev-latest.
          echo "CHANNEL=pr" >> $GITHUB_ENV
          echo "SOURCE_SHA=" >> $GITHUB_ENV
        elif [ -n "$RELEASE_TAG" ]; then
          echo "CHANNEL=promote" >> $GITHUB_ENV
          echo "SOURCE_SHA=" >> $GITHUB_ENV
        else
          # main push: build candidate images for the next release.
          echo "CHANNEL=dev" >> $GITHUB_ENV
          echo "SOURCE_SHA=" >> $GITHUB_ENV
        fi

    - name: Generate build/promote plan
      run: |
        python -I -c "import json,os,sys; sys.path.insert(0, os.environ['TOOLING_ROOT'] + '/cli'); from libs.app_build import build_plan; print(json.dumps(build_plan(app_name=sys.argv[1], channel=sys.argv[2], git_sha=sys.argv[3], source_sha=(os.environ.get('SOURCE_SHA') or None)), indent=2, ensure_ascii=False))" "${{ env.APP }}" "${{ env.CHANNEL }}" "${{ env.BUILD_SHA }}" > plan.json
        cat plan.json
        echo "CHANNEL=$(jq -r '.channel' plan.json)" >> $GITHUB_ENV
        echo "DIRECTORY=$(jq -r '.context' plan.json)" >> $GITHUB_ENV
        echo "DOCKERFILE=$(jq -r '.dockerfile' plan.json)" >> $GITHUB_ENV
        echo "README=apps/${{ env.APP }}/README.md" >> $GITHUB_ENV
        echo "VERSION_ARG=$(jq -r '.version_arg' plan.json)" >> $GITHUB_ENV
        echo "W9_VERSION=$(jq -r '.w9_version' plan.json)" >> $GITHUB_ENV
        echo "TAGS=$(jq -r '.tags | join(",")' plan.json)" >> $GITHUB_ENV
        echo "SOURCE_IMAGE=$(jq -r '.source_image // empty' plan.json)" >> $GITHUB_ENV

    - name: Build/promote summary
      run: |
        echo "::group::Build/promote plan summary"
        echo "app:          ${{ matrix.app }}"
        echo "channel:      ${{ env.CHANNEL }}"
        echo "context:      ${{ env.DIRECTORY }}"
        echo "dockerfile:   ${{ env.DOCKERFILE }}"
        echo "build-arg:    ${{ env.VERSION_ARG }}=${{ env.W9_VERSION }}"
        if [ "${{ env.CHANNEL }}" = "promote" ]; then
          echo "promote source: resolved and digest-pinned in the promotion step"
        fi
        echo "tags:"
        echo "${{ env.TAGS }}" | tr ',' '\n' | sed 's/^/  /'
        echo "::endgroup::"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Reuse matching candidate by digest
      id: reuse
      if: env.CHANNEL == 'dev' || env.CHANNEL == 'pr'
      run: |
        python -I "$TOOLING_ROOT/ci/scripts/image_candidate.py" --plan plan.json --output "$GITHUB_OUTPUT"

    - name: Build and push candidate image
      if: (env.CHANNEL == 'dev' || env.CHANNEL == 'pr') && steps.reuse.outputs.reused != 'true'
      shell: bash
      run: |
        set -euo pipefail
        IFS=',' read -r -a TAG_ARRAY <<< "${{ env.TAGS }}"

        IMAGE_REPO="${TAG_ARRAY[0]%:*}"
        AMD64_META=$(mktemp)
        ARM64_META=$(mktemp)
        trap 'rm -f "$AMD64_META" "$ARM64_META"' EXIT

        docker buildx build \
          --platform linux/amd64 \
          -f "${{ env.DOCKERFILE }}" \
          --build-arg "${{ env.VERSION_ARG }}=${{ env.W9_VERSION }}" \
          --metadata-file "$AMD64_META" \
          --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true" \
          "${{ env.DIRECTORY }}"

        AMD64_DIGEST=$(jq -r '."containerimage.digest" // empty' "$AMD64_META")
        if [ -z "$AMD64_DIGEST" ]; then
          echo "ERROR: amd64 build completed but no digest was recorded for ${{ matrix.app }}" >&2
          exit 1
        fi

        ARM64_OK=false
        if [ "${{ env.CHANNEL }}" = "dev" ]; then
          if docker buildx build \
            --platform linux/arm64 \
            -f "${{ env.DOCKERFILE }}" \
            --build-arg "${{ env.VERSION_ARG }}=${{ env.W9_VERSION }}" \
            --metadata-file "$ARM64_META" \
            --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true" \
            "${{ env.DIRECTORY }}"; then
            ARM64_OK=true
          else
            echo "::warning::arm64 image build failed for ${{ matrix.app }}; published amd64-only tags"
          fi
        fi

        ARM64_DIGEST=""
        if [ "$ARM64_OK" = true ]; then
          ARM64_DIGEST=$(jq -r '."containerimage.digest" // empty' "$ARM64_META")
          if [ -z "$ARM64_DIGEST" ]; then
            ARM64_OK=false
            echo "::warning::arm64 build completed but no digest was recorded for ${{ matrix.app }}; published amd64-only tags"
          fi
        fi

        for tag in "${TAG_ARRAY[@]}"; do
          if [ "$ARM64_OK" = true ]; then
            docker buildx imagetools create --tag "$tag" "${IMAGE_REPO}@${AMD64_DIGEST}" "${IMAGE_REPO}@${ARM64_DIGEST}"
          else
            docker buildx imagetools create --tag "$tag" "${IMAGE_REPO}@${AMD64_DIGEST}"
          fi
        done

    - name: Record published PR candidate
      if: env.CHANNEL == 'pr'
      run: |
        primary=$(jq -r '.primary_image' plan.json)
        manifest_digest=$(docker buildx imagetools inspect "$primary" --format '{{.Manifest.Digest}}')
        jq --arg digest "$manifest_digest" \
          '{app:.app,image:.w9_repo,tag:(.primary_image | split(":") | last),digest:$digest,context_tag:.context_tag}' \
          plan.json > candidate.json
        cat candidate.json

    - name: Upload PR candidate digest
      if: env.CHANNEL == 'pr'
      uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.app }}
        path: source/candidate.json
        if-no-files-found: error

    - name: Promote dev image to stable tags (release)
      if: env.CHANNEL == 'promote'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        EXPLICIT_SOURCE: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        if [ -n "$EXPLICIT_SOURCE" ]; then
          python -I "$TOOLING_ROOT/ci/scripts/image_publish.py" --app "${{ env.APP }}" --plan plan.json --explicit > promotion.json
        else
          gh api --paginate --slurp "repos/$REPOSITORY/actions/workflows/docker.yml/runs?event=push&status=success&branch=main&per_page=100" > image-runs.json
          python -I "$TOOLING_ROOT/ci/scripts/image_publish.py" --app "${{ env.APP }}" --plan plan.json --runs-file image-runs.json > promotion.json
        fi
        SOURCE_IMAGE=$(jq -r '.source_image' promotion.json)
        SOURCE_DIGEST=${SOURCE_IMAGE##*@}
        echo "Promoting $(jq -r '.source_tag' promotion.json) pinned to $SOURCE_DIGEST"
        TAG_ARGS=()
        for tag in $(echo "${{ env.TAGS }}" | tr ',' ' '); do
          existing=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_DIGEST" ]; then
            echo "::warning::overwriting existing $tag ($existing) with $SOURCE_IMAGE"
          fi
          TAG_ARGS+=(--tag "$tag")
        done
        docker buildx imagetools create "${TAG_ARGS[@]}" "$SOURCE_IMAGE"

    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: websoft9dev/${{env.APP}}
        readme-filepath: source/${{env.README}}
      if: needs.setup.outputs.has_apps == 'true' && env.CHANNEL != 'pr'
