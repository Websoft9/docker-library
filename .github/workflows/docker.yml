# Build and push custom Docker images to DockerHub.
#
# Version source of truth: docs/image-tag-spec.md.
#
# Tag namespaces (same repository, tag differs by branch):
#   main branch -> stable tags from W9_VERSION
#   dev branch  -> dev-<git-sha> (primary) + dev-latest (rolling alias)
#
# Build contract: the Dockerfile MUST declare a version ARG whose name is
# ${APP^^}_VERSION (e.g. apps/akeneo -> AKENEO_VERSION). CI reads W9_VERSION
# from apps/<app>/.env, injects it as that build-arg, and tags from W9_VERSION.
# Apps that do not declare this ARG are not built by CI; migrate them when touched.
#
# If you add more paths for trigger, please update app_list= at set-matrix for it also.

name: Build image to DockerHub

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/*/Dockerfile"
      - "apps/*/.env"
      - "apps/*/cmd.sh"
      - "apps/*/entrypoint.sh"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - id: set-matrix
      run: |
        changed_files=$(git diff --name-only HEAD^ HEAD)
        app_list=$(echo "$changed_files" | grep -E 'apps/.*/(Dockerfile|.env|cmd.sh|entrypoint.sh)$' | awk -F'/' '{print $2}' | sort | uniq)
        valid_list=()
        for app in $app_list; do
          if [ ! -f "apps/$app/Dockerfile" ]; then
            continue
          fi
          app_upper=$(echo "$app" | tr '[:lower:]' '[:upper:]')
          version_arg="${app_upper}_VERSION"
          if ! grep -qE "^ARG[[:space:]]+${version_arg}=" "apps/$app/Dockerfile"; then
            echo "skip (no ${version_arg} ARG): $app"
            continue
          fi
          valid_list+=("$app")
        done
        app_list_json=$(jq -cn '$ARGS.positional' --args "${valid_list[@]}")
        echo "::set-output name=matrix::{\"app\": $app_list_json}"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.setup.outputs.matrix)}}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install minimal CLI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Resolve channel
      run: |
        echo "APP=${{ matrix.app }}" >> $GITHUB_ENV
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "CHANNEL=promote" >> $GITHUB_ENV
        else
          echo "CHANNEL=dev" >> $GITHUB_ENV
        fi

    - name: Generate build/promote plan
      run: |
        PYTHONPATH=cli python -c "import json,sys; from libs.app_build import build_plan; print(json.dumps(build_plan(app_name=sys.argv[1], channel=sys.argv[2], git_sha=sys.argv[3]), indent=2, ensure_ascii=False))" "${{ env.APP }}" "${{ env.CHANNEL }}" "${{ github.sha }}" > plan.json
        cat plan.json
        echo "CHANNEL=$(jq -r '.channel' plan.json)" >> $GITHUB_ENV
        echo "DIRECTORY=$(jq -r '.context' plan.json)" >> $GITHUB_ENV
        echo "DOCKERFILE=$(jq -r '.dockerfile' plan.json)" >> $GITHUB_ENV
        echo "README=apps/${{ env.APP }}/README.md" >> $GITHUB_ENV
        echo "VERSION_ARG=$(jq -r '.version_arg' plan.json)" >> $GITHUB_ENV
        echo "W9_VERSION=$(jq -r '.w9_version' plan.json)" >> $GITHUB_ENV
        echo "TAGS=$(jq -r '.tags | join(",")' plan.json)" >> $GITHUB_ENV
        echo "SOURCE_IMAGE=$(jq -r '.source_image // empty' plan.json)" >> $GITHUB_ENV

    - name: Build/promote summary
      run: |
        echo "::group::Build/promote plan summary"
        echo "app:          ${{ matrix.app }}"
        echo "channel:      ${{ env.CHANNEL }}"
        echo "context:      ${{ env.DIRECTORY }}"
        echo "dockerfile:   ${{ env.DOCKERFILE }}"
        echo "build-arg:    ${{ env.VERSION_ARG }}=${{ env.W9_VERSION }}"
        if [ "${{ env.CHANNEL }}" = "promote" ]; then
          echo "promote from: ${{ env.SOURCE_IMAGE }}"
        fi
        echo "tags:"
        echo "${{ env.TAGS }}" | tr ',' '\n' | sed 's/^/  /'
        echo "::endgroup::"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image (dev)
      if: env.CHANNEL == 'dev'
      uses: docker/build-push-action@v7
      with:
        context: ${{env.DIRECTORY}}
        file: ${{env.DOCKERFILE}}
        push: true
        tags: ${{env.TAGS}}
        platforms: linux/amd64
        build-args: |
          ${{ env.VERSION_ARG }}=${{ env.W9_VERSION }}

    - name: Promote dev image to stable tags (main)
      if: env.CHANNEL == 'promote'
      run: |
        if ! docker buildx imagetools inspect "${{ env.SOURCE_IMAGE }}" >/dev/null 2>&1; then
          echo "ERROR: source dev image missing: ${{ env.SOURCE_IMAGE }}" >&2
          echo "Expected this image to be built and pushed by the dev branch workflow before main promotion." >&2
          exit 1
        fi
        TAG_ARGS=""
        for tag in $(echo "${{ env.TAGS }}" | tr ',' ' '); do
          TAG_ARGS="$TAG_ARGS --tag $tag"
        done
        docker buildx imagetools create $TAG_ARGS "${{ env.SOURCE_IMAGE }}"

    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: websoft9dev/${{env.APP}}
        readme-filepath: ${{env.README}}
      if: needs.setup.outputs.matrix != ''
