name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR checks
    # Draft PRs are checked when they become ready for review; later commits
    # on a ready PR still run the checks through the synchronize event.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PATTERN: '^(feat|fix|docs|ci|chore|refactor|perf|test|build|revert)(\([^)]+\))?!?:[[:space:]]+.+'
        run: |
          if ! [[ "$TITLE" =~ $PATTERN ]]; then
            echo "::warning::PR title should look like 'type: summary', e.g. 'fix: handle empty config'"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install libs CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e 'cli/[test]'

      - name: Check maintenance metadata
        run: python -m libs maintenance-check

      - name: Run CLI tests
        run: python -m pytest cli/tests -q

      - name: Run build tests
        run: python -m pytest tests/build -q

      - name: Validate i18n keys for changed apps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make i18n-check ARGS="--base $BASE_SHA --head $HEAD_SHA --github-annotations --warn-only"

      - name: Validate changed catalog files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'metadata/catalog/*.json')
          apps=$(printf '%s\n' "$files" | while IFS= read -r file; do
            [ -n "$file" ] && basename "$file" .json
          done | sort -u)
          for app in $apps; do
            echo "Validating catalog for $app"
            python -m libs catalog-push --app "$app" --json
          done

      - name: Verify AI command adapters are up to date
        run: make build-ai-commands ARGS="--check"
