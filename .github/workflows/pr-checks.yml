name: PR checks

on:
  # Trigger migrations must validate themselves before the new base-branch
  # pull_request_target configuration is merged. App-only PRs do not use this.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/pr-checks.yml]
  pull_request_target:
    branches: [main]
    types: [review_requested]

permissions:
  contents: read

jobs:
  handoff:
    name: Resolve PR handoff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      checks: write
    outputs:
      check_id: ${{ steps.handoff.outputs.check_id }}
    steps:
      - name: Confirm completed agent and start commit check
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo 'PR checks currently support same-repository handoffs only.' >&2
            exit 1
          fi
          if [ "$AUTHOR" = Copilot ]; then
            encoded=$(jq -rn --arg branch "$HEAD_BRANCH" '$branch | @uri')
            for attempt in $(seq 1 12); do
              run=$(gh api "repos/$REPOSITORY/actions/runs?branch=$encoded&event=dynamic&per_page=100" \
                --jq '[.workflow_runs[] | select(.path == "dynamic/copilot-swe-agent/copilot")] | sort_by(.created_at) | last // empty')
              if [ -n "$run" ] && [ "$(jq -r '.status' <<< "$run")" = completed ]; then
                test "$(jq -r '.conclusion' <<< "$run")" = success
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo 'Latest Copilot session has not completed successfully.' >&2
                exit 1
              fi
              sleep 5
            done
          fi
          current=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          test "$current" = "$HEAD_SHA"
          payload=$(jq -n --arg sha "$HEAD_SHA" --arg url "$RUN_URL" \
            '{name:"PR checks",head_sha:$sha,status:"in_progress",details_url:$url}')
          id=$(gh api --method POST "repos/$REPOSITORY/check-runs" --input - --jq '.id' <<< "$payload")
          echo "check_id=$id" >> "$GITHUB_OUTPUT"

  detect-buildable:
    name: Detect image build inputs
    needs: handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
    steps:
      - name: Checkout build-input tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compare Dockerfile build inputs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main || git fetch --no-tags origin "$BASE_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          python3 cli/libs/docker_inputs.py --changed \
            --base "$BASE_SHA" --head "$HEAD_SHA" --json > inputs.json
          cat inputs.json
          echo "matrix=$(jq -c '.apps' inputs.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.apps | length' inputs.json)" -gt 0 ]; then
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    name: Build PR image candidates
    permissions:
      contents: read
      actions: read
    needs: [handoff, detect-buildable]
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.detect-buildable.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-buildable.outputs.matrix) }}
    uses: ./.github/workflows/docker.yml
    with:
      app: ${{ matrix.app }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
      tooling_sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  pr-checks:
    name: Validate PR package
    needs: handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: pr-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PATTERN: '^(feat|fix|docs|ci|chore|refactor|perf|test|build|revert)(\([^)]+\))?!?:[[:space:]]+.+'
        run: |
          if ! [[ "$TITLE" =~ $PATTERN ]]; then
            echo "::warning::PR title should look like 'type: summary', e.g. 'fix: handle empty config'"
          fi

      - name: Checkout PR files for validation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install libs CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e 'cli/[test]'

      - name: Check maintenance metadata
        run: python -m libs maintenance-check

      - name: Run CLI tests
        run: python -m pytest cli/tests -q

      - name: Run build tests
        run: python -m pytest tests/build -q

      - name: Validate i18n keys for changed apps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make i18n-check ARGS="--base $BASE_SHA --head $HEAD_SHA --github-annotations --warn-only"

      - name: Validate changed catalog files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'metadata/catalog/*.json')
          apps=$(printf '%s\n' "$files" | while IFS= read -r file; do
            [ -n "$file" ] && basename "$file" .json
          done | sort -u)
          for app in $apps; do
            echo "Validating catalog for $app"
            python -m libs catalog-push --app "$app" --json
          done

      - name: Verify AI command adapters are up to date
        run: make build-ai-commands ARGS="--check"

  report-check:
    name: Report PR checks and mark ready
    needs: [handoff, detect-buildable, pr-checks, build-images]
    if: always() && needs.handoff.outputs.check_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Publish commit check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_ID: ${{ needs.handoff.outputs.check_id }}
          RESULT: ${{ needs.pr-checks.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          DETECT_RESULT: ${{ needs.detect-buildable.result }}
          HAS_IMAGES: ${{ needs.detect-buildable.outputs.has_apps }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          build_ok=false
          if [ "$DETECT_RESULT" = success ]; then
            if [ "$EVENT_NAME" != pull_request_target ]; then
              build_ok=true
            elif [ "$HAS_IMAGES" = false ] && [ "$BUILD_RESULT" = skipped ]; then
              build_ok=true
            elif [ "$HAS_IMAGES" = true ] && [ "$BUILD_RESULT" = success ]; then
              build_ok=true
            fi
          fi
          conclusion=failure
          if [ "$RESULT" = success ] && [ "$build_ok" = true ] && [ "$current" = "$HEAD_SHA" ]; then
            conclusion=success
          fi
          gh api --method PATCH "repos/$REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$conclusion"
          if [ "$conclusion" != success ]; then
            exit 1
          fi

      - name: Mark successful PR ready
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.MAINTENANCE_STATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          draft=$(GH_TOKEN="${GH_TOKEN:-${{ github.token }}}" gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.draft')
          if [ "$draft" != true ]; then
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::Set COPILOT_ASSIGN_TOKEN or MAINTENANCE_STATE_TOKEN with pull-request write access to mark the Copilot PR ready.'
            exit 1
          fi
          current=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          test "$current" = "$HEAD_SHA"
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"

  provision-e2e:
    name: Provision owner E2E environment
    needs: [pr-checks, report-check, build-images]
    if: >-
      !cancelled() &&
      needs.pr-checks.result == 'success' &&
      needs.report-check.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'Copilot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: provision-e2e-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted base tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Download PR image candidates
        if: needs.build-images.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: candidates

      - name: Download PR source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/zipball/$HEAD_SHA" > pr-source.zip
          mkdir -p pr-source
          python - <<'PY'
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          destination = Path("pr-source")
          with zipfile.ZipFile("pr-source.zip") as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit(f"Unsafe PR archive entry: {item.filename}")
              archive.extractall(destination)

          roots = [path for path in destination.iterdir() if path.is_dir()]
          if len(roots) != 1:
              raise SystemExit("Expected one root directory in the PR source archive")
          source_root = roots[0]
          for relative in (Path("apps"), Path("metadata/catalog")):
              root = source_root / relative
              if root.exists():
                  for path in root.rglob("*"):
                      if path.is_symlink():
                          raise SystemExit(f"Symlinks are not allowed in PR package data: {path}")
          Path("pr-source-root.txt").write_text(str(source_root), encoding="utf-8")
          PY
          source_root=$(<pr-source-root.txt)
          mkdir -p apps
          cp -a "$source_root/apps/." ./apps/
          if [ -d "$source_root/metadata/catalog" ]; then
            mkdir -p metadata/catalog
            cp -a "$source_root/metadata/catalog/." metadata/catalog/
          fi

      - name: Detect changed applications
        id: apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          is_current() {
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state == "open", .draft == false, .head.sha] | @tsv'
          }
          expected=$(printf 'true\ttrue\t%s' "$HEAD_SHA")
          if [ "$(is_current)" != "$expected" ]; then
            echo "PR is closed, draft, or has newer commits; skipping this E2E environment."
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apps=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | awk -F/ '$1 == "apps" && $2 != "" {print $2}' \
            | sort -u \
            | paste -sd, -)
          if [ "$(is_current)" != "$expected" ]; then
            echo "PR changed while reading its files; skipping this E2E environment."
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=',' read -r -a app_list <<< "$apps"
          for app in "${app_list[@]}"; do
            [ -n "$app" ] || continue
            if ! [[ "$app" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::Invalid app directory in PR: $app"
              exit 1
            fi
          done
          if [ -z "$apps" ]; then
            echo "No application changes found; no E2E environment is needed."
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "list=$apps" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CLI
        if: steps.apps.outputs.list != ''
        run: make install

      - name: Write SSH key
        if: steps.apps.outputs.list != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p .secrets/ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > .secrets/ssh/e2e.pem
          chmod 600 .secrets/ssh/e2e.pem

      - name: Create temporary Websoft9 server
        if: steps.apps.outputs.list != ''
        id: server
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t types < <(jq -r '(.instance.type | if type == "array" then .[] else . end)' ci/cloud/aliyun-ecs.json)
          disk_size=$(jq -r '.system_disk.default_size_gib // 200' ci/cloud/aliyun-ecs.json)
          last_error=""
          for instance_type in "${types[@]}"; do
            echo "Trying instance type: $instance_type"
            stdout=$(mktemp)
            stderr=$(mktemp)
            if make create-aliyun-ecs ARGS="--name libs-pr-$PR_NUMBER-${HEAD_SHA:0:7} --instance-type $instance_type --disk-size $disk_size --release-in 2h --yes --wait-timeout 180 --json" >"$stdout" 2>"$stderr"; then
              cat "$stdout" > server.json
              cat "$stderr" >&2 || true
              ip=$(jq -r '.public_ip // empty' server.json)
              if [ -n "$ip" ]; then
                echo "ip=$ip" >> "$GITHUB_OUTPUT"
                echo "expires=$(jq -r '.auto_release_time' server.json)" >> "$GITHUB_OUTPUT"
                rm -f "$stdout" "$stderr"
                exit 0
              fi
              cat "$stdout" >&2
              echo "::error::Instance was created but no public IP was assigned for $instance_type"
              rm -f "$stdout" "$stderr"
              exit 1
            fi
            cat "$stdout" "$stderr" >&2 || true
            last_error=$(cat "$stderr")
            echo "::warning::Instance type $instance_type failed"
            rm -f "$stdout" "$stderr"
          done
          echo "::error::Could not create a Websoft9 E2E server: ${last_error:-all instance types failed}"
          exit 1

      - name: Wait for SSH
        id: ssh
        if: steps.apps.outputs.list != ''
        env:
          HOST: ${{ steps.server.outputs.ip }}
        run: |
          for attempt in $(seq 1 60); do
            if timeout --signal=KILL 10s ssh -i .secrets/ssh/e2e.pem -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 root@"$HOST" 'true'; then
              echo "deadline=$(($(date +%s) + 300))" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "SSH did not become reachable in time" >&2
          exit 1

      - name: Wait for appstore readiness and sync applications
        if: steps.apps.outputs.list != ''
        env:
          HOST: ${{ steps.server.outputs.ip }}
          APPS: ${{ steps.apps.outputs.list }}
          DEADLINE: ${{ steps.ssh.outputs.deadline }}
        run: |
          set -euo pipefail
          while true; do
            remaining=$((DEADLINE - $(date +%s)))
            if [ "$remaining" -le 0 ]; then
              echo "Websoft9 appstore directories were not ready within the 5-minute post-SSH budget" >&2
              exit 1
            fi
            if timeout --signal=KILL "$((remaining < 10 ? remaining : 10))s" \
              ssh -i .secrets/ssh/e2e.pem \
              -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              root@"$HOST" \
              'docker exec websoft9 sh -c '\''test -d /websoft9/library/apps'\'''; then
              break
            fi
            remaining=$((DEADLINE - $(date +%s)))
            if [ "$remaining" -gt 0 ]; then
              echo "Websoft9 appstore is still initializing; retrying."
              sleep "$((remaining < 10 ? remaining : 10))"
            fi
          done

          IFS=',' read -r -a app_list <<< "$APPS"
          for app in "${app_list[@]}"; do
            attempt=0
            while true; do
              remaining=$((DEADLINE - $(date +%s)))
              if [ "$remaining" -le 0 ]; then
                echo "Appstore sync exceeded the 5-minute post-SSH budget" >&2
                exit 1
              fi
              version_args=()
              candidate="candidates/image-$app/candidate.json"
              if [ -f "$candidate" ]; then
                version_args=(--version "$(jq -r '.tag' "$candidate")")
                echo "PR candidate image for $app: $(jq -r '.image + "@" + .digest' "$candidate")"
              fi
              if timeout --signal=KILL "$((remaining < 60 ? remaining : 60))s" \
                .venv/bin/libs appstore-sync --app "$app" --ssh-host "$HOST" \
                --ssh-user root --ssh-secret-path .secrets/ssh/e2e.pem "${version_args[@]}" --progress --json; then
                break
              fi
              attempt=$((attempt + 1))
              remaining=$((DEADLINE - $(date +%s)))
              if [ "$remaining" -le 0 ]; then
                echo "Appstore sync failed for $app within the 5-minute post-SSH budget" >&2
                exit 1
              fi
              echo "Appstore sync attempt $attempt failed for $app; retrying within the 5-minute post-SSH budget"
              sleep "$((remaining < 10 ? remaining : 10))"
            done
          done

      - name: Report test environment
        id: report
        if: success() && steps.apps.outputs.list != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOST: ${{ steps.server.outputs.ip }}
          EXPIRES: ${{ steps.server.outputs.expires }}
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "PR has newer commits; this environment is obsolete and will expire automatically."
            exit 0
          fi
          cat > e2e-comment.md <<EOF
          ## Owner E2E Environment

          - status: ready
          - apps: $APPS
          - commit: $HEAD_SHA
          - server IP: $HOST
          - expires: $EXPIRES
          - synced: PR application packages and catalog data

          The environment is temporary and will be released automatically. Complete the Websoft9 installation, login, and core workflow checks, then record the result in this PR.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file e2e-comment.md
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Notify WeCom that environment is ready
        if: success() && steps.report.outputs.ready == 'true'
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOST: ${{ steps.server.outputs.ip }}
          EXPIRES: ${{ steps.server.outputs.expires }}
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          if [ -z "${WECOM_WEBHOOK:-}" ]; then
            echo '::warning::WECOM_WEBHOOK is not set; skipping ready notification'
            exit 0
          fi
          content=$(printf '# Websoft9 E2E environment ready\n> Repository: %s\n> PR: [%s](%s)\n> App: %s\n> Commit: `%s`\n> Server IP: `%s`\n> Expires: %s\n\nPlease complete the Websoft9 installation, login, and core workflow checks.' \
            "$REPOSITORY" "#$PR_NUMBER" "$PR_URL" "$APPS" "${HEAD_SHA:0:12}" "$HOST" "$EXPIRES")
          payload=$(jq -n --arg content "$content" '{msgtype:"markdown",markdown:{content:$content}}')
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$WECOM_WEBHOOK" || echo '::warning::WeCom notification failed'

      - name: Notify WeCom that environment provisioning failed
        if: failure()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APPS: ${{ steps.apps.outputs.list }}
        run: |
          if [ -z "${WECOM_WEBHOOK:-}" ]; then
            echo '::warning::WECOM_WEBHOOK is not set; skipping failure notification'
            exit 0
          fi
          content=$(printf '# Websoft9 E2E environment provisioning failed\n> Repository: %s\n> PR: [%s](%s)\n> App: %s\n> [View workflow](%s)\n\nPlease check the Actions logs.' \
            "$REPOSITORY" "#$PR_NUMBER" "$PR_URL" "$APPS" "$RUN_URL")
          payload=$(jq -n --arg content "$content" '{msgtype:"markdown",markdown:{content:$content}}')
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$WECOM_WEBHOOK" || echo '::warning::WeCom notification failed'
