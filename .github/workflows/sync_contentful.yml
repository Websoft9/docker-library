# workflow_dispatch mode syncs active and archived applications.
# push trigger mode only syncs apps whose variables or catalog files changed.

name: Sync data to Contentful

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/*/variables.json"
      - "metadata/catalog/*.json"

permissions:
  contents: read

jobs:
  sync-to-contentful:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install libs CLI
      run: |
        python -m pip install --upgrade pip
        pip install -e cli/

    - name: Resolve changed apps
      id: apps
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.event.after }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          apps=$(printf '%s\n' apps/*/ archive/apps/*/ | awk -F/ '{print $2 == "apps" ? $3 : $2}' | sed '/^$/d' | sort -u)
        else
          files=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'apps/*/variables.json' 'metadata/catalog/*.json')
          apps=$(printf '%s\n' "$files" | while IFS= read -r file; do
            case "$file" in
              apps/*/variables.json) basename "$(dirname "$file")" ;;
              metadata/catalog/*.json) basename "$file" .json ;;
            esac
          done | sed '/^$/d' | sort -u)
        fi
        echo "list=$(printf '%s\n' "$apps" | paste -sd, -)" >> "$GITHUB_OUTPUT"

    - name: Sync changed apps
      if: steps.apps.outputs.list != ''
      env:
        CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
      run: |
        IFS=',' read -r -a app_list <<< "${{ steps.apps.outputs.list }}"
        for app in "${app_list[@]}"; do
          echo "::group::Contentful sync: $app"
          python -m libs catalog-push --app "$app" --apply
          echo "::endgroup::"
        done
