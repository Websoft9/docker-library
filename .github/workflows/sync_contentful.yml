# workflow_dispatch mode syncs active and archived applications
# push trigger mode only syncs changed applications

name: Sync data to Contentful

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/*/variables.json"
      
jobs:
  sync-to-contentful:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get changed applist
      id: getlist
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          # 使用GitHub提供的前后提交SHA
          git diff --name-only ${{ github.event.before }} ${{ github.event.after }}
          echo "APP_LISTS=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- 'apps/*/variables.json' | awk -F/ '{print $2}' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "APP_LISTS=$(printf '%s\n' apps/*/ archive/apps/*/ | awk -F/ '{print $2 == "apps" ? $3 : $2}' | sed '/^$/d' | sort -u | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
        fi
    
      # if judge release=true, insert code to cut APP_LISTS

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests contentful_management pyyaml

    - name:  Run sync_contentful.py
      env:
        CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
        APP_LISTS: ${{ env.APP_LISTS }}
      run: python ./build/sync_contentful.py
      if: env.APP_LISTS != ''
