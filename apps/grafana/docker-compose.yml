services:

  grafana:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}  
    restart: unless-stopped
    ports:
      - ${W9_HTTP_PORT_SET}:3000 # Web console
    volumes:
      - data:/var/lib/grafana
      - config:/etc/grafana
      - logs:/var/log/grafana
      - plugins:/var/lib/grafana/plugins
    env_file: .env

  loki:
    image: grafana/loki
    container_name: ${W9_ID}-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail
    container_name: ${W9_ID}-promtail
    restart: unless-stopped
    volumes:
      -  promtail_log:/var/log

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  data:
  config:
  logs:
  plugins:
  loki_data:
  promtail_log: