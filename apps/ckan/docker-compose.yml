version: "3.8"

services:
  ckan-base:
    container_name: ${W9_ID}
    image: ${W9_REPO}:${W9_VERSION}
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:5000" # Web Console
    volumes:
      - ckan_storage:/var/lib/ckan
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/lib/python3.10/site-packages
      - vscode_server:/root/.vscode-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  datapusher:
    container_name: ${W9_ID}-datapusher
    image: ${W9_REPO}-datapusher:${DATAPUSHER_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8800"]
      interval: 60s
      timeout: 10s
      retries: 3

  db:
    container_name: ${W9_ID}-postgres
    image: postgres:${W9_DB_VERSION}
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_POSTGRES_DB
      - CKAN_POSTGRES_USER
      - CKAN_POSTGRES_USER_PWD
      - CKAN_DATASTORE_POSTGRES_DB
      - CKAN_DATASTORE_POSTGRES_READ_USER
      - CKAN_DATASTORE_POSTGRES_READ_PWD
      - CKAN_DATASTORE_POSTGRES_WRITE_USER
      - CKAN_DATASTORE_POSTGRES_WRITE_PWD
    volumes:
      - ./src/postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]

  solr:
    container_name: ${W9_ID}-solr
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION}
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]

  redis:
    container_name: ${W9_ID}-redis
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]

volumes:
  ckan_storage:
  pg_data:
  solr_data:
  pip_cache:
  site_packages:
  vscode_server:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
