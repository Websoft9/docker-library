# database-backup-service only for your references

services:
  postgres:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_DB_PORT_SET}:5432" # PostgreSQL
    volumes:
      - postgres:/var/lib/postgresql/data
    env_file: .env

  database-backup-service:
    image: postgres:alpine
    container_name: ${W9_ID}-backup
    volumes:
      - backup:/backup
    depends_on:
      - postgres
    profiles:
      - backup
    command: >
      sh -c 'if [ "${DATABASE_BACKUP}" = "true" ]; then
        until PGPASSWORD=${W9_POWER_PASSWORD} pg_isready -h ${W9_ID} -p 5432; do
          echo "Waiting for PostgreSQL to become available..." && sleep 1;
        done;
        PGPASSWORD=${W9_POWER_PASSWORD} pg_dump --host=${W9_ID} --port=5432 --username=${W9_LOGIN_USER} --dbname=${W9_ID} -f "/backup/dump_$(date +'%Y%m%d%H%M%S').sql" &&
        find /backup -type f -mtime +30 -delete &&
        echo "Dump taken successfully." &&
        exit 0;
      else
        echo "Skipping backup." &&
        exit 1;
      fi'

volumes:
  postgres:
  backup:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
