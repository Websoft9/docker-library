services:
  registry:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    ports:
      - ${W9_HTTP_PORT_SET}:5000 # Registry HTTP API
    volumes:
      - data:/var/lib/registry

volumes:
  data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
