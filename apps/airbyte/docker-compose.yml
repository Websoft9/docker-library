# Airbyte runs inside a dedicated k3s runtime container.
# A lightweight installer container performs the Helm install and waits until
# the real Airbyte health endpoint is ready.

services:
  airbyte:
    image: ${AIRBYTE_K3S_IMAGE}
    container_name: ${W9_ID}
    privileged: true
    restart: unless-stopped
    mem_limit: ${AIRBYTE_RUNTIME_MEMORY_LIMIT}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    command:
      - server
      - --disable=traefik
      - --disable=servicelb
      - --tls-san=airbyte
      - --write-kubeconfig=/shared/kubeconfig.yaml
      - --write-kubeconfig-mode=644
    ports:
      - "${W9_HTTP_PORT_SET}:${AIRBYTE_NODE_PORT}" # Web Console
    tmpfs:
      - /run
      - /var/run
    volumes:
      - kubeconfig:/shared
      - k3s-data:/var/lib/rancher/k3s
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - default

  airbyte-installer:
    image: alpine/helm:3.16.3
    container_name: ${W9_ID}-installer
    restart: "no"
    depends_on:
      airbyte:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "/usr/local/bin/airbyte-installer.sh"]
    volumes:
      - kubeconfig:/shared
      - ./src/installer/entrypoint.sh:/usr/local/bin/airbyte-installer.sh:ro
    networks:
      - default

volumes:
  kubeconfig:
  k3s-data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
