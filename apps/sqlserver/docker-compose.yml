services:
  sqlserver:
    image: ${W9_REPO}:${W9_VERSION}-latest
    container_name: ${W9_ID}
    env_file: .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${W9_LOGIN_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    ports:
      - "${W9_DB_PORT_SET}:1433" # SQL Server
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  mssql_data:
