# Websoft9 Gateway (Nginx Proxy Manager) advanced config.
# The platform reads this file from src/nginx-proxy.conf and injects it into the
# Proxy Host server{} block. It is NOT mounted into any container.
#
# Seafile serves its web assets with chunked transfer encoding. The gateway's
# default proxy buffering can truncate those responses, which shows up in the
# browser as ERR_INCOMPLETE_CHUNKED_ENCODING and a blank page after login. The
# directives below follow the official Seafile "Use other reverse proxy" guide.

location / {
    proxy_pass $forward_scheme://$server:$port$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 36000s;
    proxy_send_timeout 36000s;
    client_max_body_size 0;
}
