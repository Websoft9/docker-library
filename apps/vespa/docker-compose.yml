version: '3.8'

services:
  vespa:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    hostname: vespa-container
    command: ["configserver,services"]
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # HTTP API (query/document)
      - "${W9_API_PORT_SET}:19071" # Config server (deployment API)
    volumes:
      - vespa-var:/opt/vespa/var
      - vespa-logs:/opt/vespa/logs
    environment:
      VESPA_CONFIGSERVERS: vespa-container
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19071/state/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    env_file:
      - .env

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  vespa-var:
  vespa-logs:
