# dockerhub: https://hub.docker.com/_/haproxy/

version: '3.8'

services:
  haproxy:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    ports:
      - "9008:80" # Gateway and Stats UI
    volumes:    
      - ./src/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    restart: unless-stopped
    user: root
    env_file: .env

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  haproxy:
