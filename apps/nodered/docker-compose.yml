services:
  nodered:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    ports:
      - "${W9_HTTP_PORT_SET}:1880" # Web Console
    volumes:
      - nodered_data:/data
      # - ./src/my_flows.json:/data/my_flows.json
    env_file: .env
    restart: unless-stopped

volumes:
  nodered_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
