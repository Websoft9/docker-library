services:
  kafka:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    hostname: ${W9_ID}
    restart: unless-stopped
    # Listener ports (defined in .env):
    #   9092  PLAINTEXT_HOST - external clients, published below
    #   19092 PLAINTEXT      - in-network clients such as Redpanda Console; internal only
    #   29093 CONTROLLER     - KRaft controller quorum; internal only
    # Only the external listener is published. 19092 and 29093 intentionally stay on
    # the websoft9 network and must not be exposed to the host.
    ports:
      - "${W9_MQ_PORT_SET}:9092" # Kafka broker (external clients)

    env_file: .env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  kafka_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
