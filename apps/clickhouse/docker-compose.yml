services:

  clickhouse:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    env_file: .env
    ports:
      - "${W9_HTTP_PORT_SET}:8123" # HTTP interface and Play UI
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - clickhouse-config:/etc/clickhouse-server/config.d
      - clickhouse-userconfig:/etc/clickhouse-server/users.d
      - ./src/extra_config.xml:/etc/clickhouse-server/config.d/extra_config.xml
      - ./src/extra_user.xml:/etc/clickhouse-server/users.d/extra_user.xml

volumes:
  clickhouse-userconfig:
  clickhouse-config:
  clickhouse-data:
  clickhouse_logs:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
