services:
  arangodb:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${W9_HTTP_PORT_SET}:8529' #Admin Console
    environment:
      - ARANGO_ROOT_PASSWORD=${W9_POWER_PASSWORD}
    volumes:
      - 'db:/var/lib/arangodb3'
      - 'apps:/var/lib/arangodb3-apps'

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  db:
  apps:
