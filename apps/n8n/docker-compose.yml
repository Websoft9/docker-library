services:
  n8n:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:5678" # Web Console
    volumes:
      - n8n:/home/node/.n8n

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  n8n:
