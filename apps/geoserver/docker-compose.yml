services:
  geoserver:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # Web UI and OGC services
    env_file: .env
    volumes:
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --url \"$$(cat $$CATALINA_HOME/conf/healthcheck_url.txt)\" || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

volumes:
  geoserver_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
