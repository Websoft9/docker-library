; Moodle PHP overrides for Websoft9.
;
; Mounted to: /usr/local/etc/php/conf.d/zz-websoft9.ini
; Loaded after the image's own /usr/local/etc/php/conf.d/zz-moodle.ini, so the
; values below win. Edit this file and restart the container to apply changes.
;
; Other ways to add PHP parameters in this image:
;   1. Environment variable PHP_INI-<name>=<value> (written to conf.d/20-local.ini)
;   2. Any *.ini file mounted into /docker-entrypoint.d/ (copied to conf.d/ at start)
;   3. Any *.ini file mounted directly into /usr/local/etc/php/conf.d/
;
; Reference: https://docs.moodle.org/en/PHP_settings

; --- Moodle recommended values ---
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 600
max_input_vars = 5000
max_input_time = 600

; --- Websoft9 additions: add your own parameters below ---
; Example:
; date.timezone = Asia/Shanghai
; opcache.enable = 1
