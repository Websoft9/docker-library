services:
  app-nogpu:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "9001:11434" # API
    env_file:
      - .env
    volumes:
      - ollama:/root/.ollama

  app-nvidia:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    ports:
      - "9001:11434" # API
    env_file:
      - .env
    volumes:
      - ollama:/root/.ollama
    profiles:
      - nvidia

volumes:
  ollama:
    
networks:
  default:
    name: ${W9_NETWORK}
    external: true
