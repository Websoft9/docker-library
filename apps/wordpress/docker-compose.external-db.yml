# image,docs: https://hub.docker.com/_/wordpress/

version: '3.8'

services:
  init:
    image: docker:latest
    container_name: $W9_ID-init
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src/init.sh:/data/init.sh
    env_file: .env
    depends_on:
      - wordpress
    working_dir: /data
    command: ["sh", "-c", "chmod +x /data/init.sh;/data/init.sh"]


  wordpress:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: 10m
    ports:
      - $W9_HTTP_PORT_SET:80
    env_file: .env
    volumes:
      - wordpress:/var/www/html
      - ./src/php_exra.ini:/usr/local/etc/php/conf.d/php_exra.ini
      
volumes:
  wordpress:
    
networks:
  default:
    name: $W9_NETWORK
    external: true
