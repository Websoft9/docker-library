services:
  cloudbeaver:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${W9_HTTP_PORT_SET}:8978" # Web Console
    volumes:
      - cloudbeaver:/opt/cloudbeaver/workspace

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  cloudbeaver:
