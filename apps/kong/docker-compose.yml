services:
  kong-migrations:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-migrations
    command: kong migrations bootstrap
    depends_on:
      - db
    env_file: .env
    restart: on-failure

  kong-migrations-up:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-migrations-up
    command:
      - /bin/sh
      - -ec
      - kong migrations up && kong migrations finish
    depends_on:
      - db
    env_file: .env
    restart: on-failure

  kong:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    depends_on:
      kong-migrations-up:
        condition: service_completed_successfully
    user: "${KONG_USER:-kong}"
    env_file: .env
    ports:
      - "${W9_HTTP_PORT_SET}:8000" # Proxy
      - "${W9_ADMIN_API_PORT_SET}:8001" # Admin API
      - "${W9_ADMIN_GUI_PORT_SET}:8002" # Kong Manager
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    read_only: true
    volumes:
      - kong_tmp_vol:/tmp
      - ./src/config:/opt/kong
    security_opt:
      - no-new-privileges

  db:
    image: postgres:${W9_DB_VERSION}
    container_name: ${W9_ID}-postgresql
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE}
      POSTGRES_USER: ${KONG_PG_USER}
      POSTGRES_PASSWORD: ${W9_POWER_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${KONG_PG_DATABASE}", "-U", "${KONG_PG_USER}"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: on-failure
    stdin_open: true
    tty: true
    volumes:
      - "postgres:/var/lib/postgresql/data"

volumes:
  postgres:
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  default:
    name: ${W9_NETWORK}
    external: true
