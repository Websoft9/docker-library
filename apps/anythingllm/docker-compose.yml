services:

  anythingllm:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "${W9_HTTP_PORT_SET}:3001" # Web Console
    env_file: .env
    volumes:
      - anythingllm:/app/server/storage

volumes:
  anythingllm:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
