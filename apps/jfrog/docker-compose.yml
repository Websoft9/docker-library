services:

  jfrog:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${W9_HTTP_PORT_SET}:8082" # JFrog Platform web console
    volumes:
      - jfrog_data:/var/opt/jfrog/artifactory
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/router/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  jfrog_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
