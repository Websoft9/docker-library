services:
  rails:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    volumes:
      - chatwoot:/app/storage
    depends_on:
      - postgres
      - redis
    ports:
      - "${W9_HTTP_PORT_SET}:3000" # Web Console
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    entrypoint: docker/entrypoints/rails.sh
    command:
      [
        'sh',
        '-lc',
        'bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0'
      ]

  sidekiq:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-sidekiq
    restart: unless-stopped
    env_file: .env
    volumes:
      - chatwoot:/app/storage
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Please provide your own password.
      - POSTGRES_PASSWORD=${W9_POWER_PASSWORD}

  redis:
    image: redis:alpine
    container_name: ${W9_ID}-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server"]
    volumes:
      - /data/redis:/data

volumes:
  postgres:
  storage:
  chatwoot:
    
networks:
  default:
    name: ${W9_NETWORK}
    external: true
