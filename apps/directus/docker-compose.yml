services:
  directus:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:8055" # Web Console
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - directus_sqlite:/directus/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      cache:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:${W9_DB_VERSION}
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${W9_ID}
      POSTGRES_USER: ${W9_ID}
      POSTGRES_PASSWORD: ${W9_POWER_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=${W9_ID}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: redis:7
    container_name: ${W9_ID}-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  postgres:
  directus_uploads:
  directus_extensions:
  directus_sqlite:
