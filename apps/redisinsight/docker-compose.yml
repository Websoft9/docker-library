version: '3.8'

services:
  redisinsight:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:5540" # RedisInsight web console
    volumes:
      - redisinsight:/data
    restart: unless-stopped

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  redisinsight:
