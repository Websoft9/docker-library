services:
  opensearch:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    hostname: ${W9_RCODE}
    env_file: .env
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true              # along with the memlock settings below, disables swapping
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m  # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${W9_POWER_PASSWORD}    # Sets the demo admin user password when using demo configuration, required for OpenSearch 2.12 and higher
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536  # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${W9_HTTPS_PORT_SET}:9200" # HTTPS API
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: ${W9_REPO}-dashboards:${W9_VERSION}
    container_name: ${W9_ID}-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    ports:
      - "${W9_DASHBOARD_PORT_SET}:5601" # Dashboards
    expose:
      - '5601'
    environment:
      OPENSEARCH_HOSTS: '["https://${W9_RCODE}:9200"]'
    env_file: .env

  busybox:
    image: busybox
    command: /bin/sh -c "sysctl -w vm.max_map_count=262144"
    privileged: true

volumes:
  opensearch-data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
