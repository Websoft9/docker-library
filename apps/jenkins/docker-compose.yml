services:
  jenkins:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    user: root
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # Web Console
    env_file: .env
    volumes:
      - jenkins:/var/jenkins_home

volumes:
  jenkins:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
