services:
  mongodb:
    image: mongo:${W9_DB_VERSION}
    container_name: ${W9_ID}-mongodb
    restart: "on-failure"
    volumes:
      - mongodb_data:/data/db

  datanode:
    image: graylog/graylog-datanode:${W9_VERSION}
    container_name: ${W9_ID}-datanode
    environment:
      GRAYLOG_DATANODE_NODE_ID_FILE: "/var/lib/graylog-datanode/node-id"
      GRAYLOG_DATANODE_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_DATANODE_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_DATANODE_MONGODB_URI: ${GRAYLOG_MONGODB_URI}
    ulimits:
      memlock:
        hard: -1
        soft: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - "graylog-datanode:/var/lib/graylog-datanode"
    restart: "on-failure"

  graylog:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    env_file: .env
    entrypoint: "/usr/bin/tini --  /docker-entrypoint.sh"
    environment:
      GRAYLOG_NODE_ID_FILE: "/usr/share/graylog/data/config/node-id"
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "${GRAYLOG_EXTERNAL_URL}/"
      GRAYLOG_MONGODB_URI: ${GRAYLOG_MONGODB_URI}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: "service_started"
      datanode:
        condition: "service_started"
    ports:
      - "9001:9000/tcp" # Web Console and API
      - "5044:5044/tcp" # Beats
      - "5140:5140/udp" # Syslog UDP
      - "5140:5140/tcp" # Syslog
      - "5555:5555/tcp" # RAW TCP
      - "5555:5555/udp" # RAW UDP
      - "12201:12201/tcp" # GELF TCP
      - "12201:12201/udp" # GELF UDP
      - "13301:13301/tcp" # Forwarder data
      - "13302:13302/tcp" # Forwarder config
    volumes:
      - graylog_data:/usr/share/graylog/data/
      - graylog_plugin:/usr/share/graylog/plugin

volumes:
  graylog_data:
  graylog_plugin:
  graylog-datanode:
  mongodb_data:


networks:
  default:
    name: ${W9_NETWORK}
    external: true
