services:
  phpmyadmin:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./src/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    ports:
      - "9001:80" # Web Console

  db:
    image: mariadb:10.3
    container_name: ${W9_ID}-mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    profiles:
      - db
    networks:
      default:
        aliases:
          - mysql

networks:
  default:
    name: ${W9_NETWORK}
    external: true
