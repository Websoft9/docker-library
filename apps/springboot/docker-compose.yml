services:

  springboot:
    image: ${W9_REPO}:3.9-eclipse-temurin-21
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # Web Console
    volumes:
      - springboot_workspace:/workspace
      - springboot_m2:/root/.m2
      - ./src/entrypoint.sh:/entrypoint.sh:ro
      - ./src/template:/opt/template:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  # Optional bundled database. It only starts when the "postgres" profile is
  # enabled via COMPOSE_PROFILES in .env.
  postgres:
    image: postgres:${W9_DB_VERSION}
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: springboot
      POSTGRES_USER: springboot
      POSTGRES_PASSWORD: ${W9_POWER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springboot -d springboot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  springboot_workspace:
  springboot_m2:
  postgres_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
