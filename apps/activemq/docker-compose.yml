# official image: https://hub.docker.com/r/apache/activemq
# upstream docs: https://github.com/apache/activemq/tree/main/assembly/src/docker

services:
  activemq:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/websoft9/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8161'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    env_file: .env
    volumes:
      - activemq_data:/opt/apache-activemq/data
      - ./src/entrypoint.sh:/opt/websoft9/entrypoint.sh:ro
    ports:
      - "$W9_HTTP_PORT_SET:8161"    # Web Console
      - "$W9_AMQP_PORT_SET:5672"    # AMQP
      - "$W9_OPENWIRE_PORT_SET:61616" # OpenWire
      - "$W9_STOMP_PORT_SET:61613"  # STOMP
      # - "1883:1883"   # MQTT
      # - "61614:61614" # WS
      # - "1099:1099"   # JMX

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  activemq_data:
