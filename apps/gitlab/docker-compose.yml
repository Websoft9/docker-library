services:

  gitlab:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: "${W9_ID}"
    hostname: "${W9_URL}"
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: 200m
    env_file: .env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${W9_URL}'
        nginx['listen_port'] = 80
        gitlab_rails['gitlab_shell_ssh_port'] = ${W9_SSH_PORT_SET}
        gitlab_rails['initial_root_password'] = '${W9_LOGIN_PASSWORD}'
        # Add any other gitlab.rb configuration here, each on its own line
        # other
    shm_size: '256m'
    restart: unless-stopped
    ports:
      - '${W9_HTTP_PORT_SET}:80' # Web Console
      - '${W9_SSH_PORT_SET}:22' # Git SSH
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  runner:
    image: gitlab/gitlab-runner:latest
    container_name: ${W9_ID}-runner
    profiles:
      - runner
    restart: unless-stopped
    volumes:
      - gitlab_runner:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner:
