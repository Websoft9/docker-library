# image: https://github.com/openclaw/openclaw/pkgs/container/openclaw
# docs: https://docs.openclaw.ai/install/docker

services:
  # One-time permission fix so the named volume is writable by uid 1000 (node).
  # Mirrors what the official docker-setup.sh does before starting the gateway.
  openclaw-init:
    image: $W9_REPO:$W9_VERSION
    container_name: ${W9_ID}-init
    restart: "no"
    user: "0"
    entrypoint:
      - "sh"
      - "-c"
      - |
        mkdir -p /home/node/.openclaw
        [ ! -s /home/node/.openclaw/openclaw.json ] && cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
        chown -R 1000:1000 /home/node/.openclaw
    volumes:
      - openclaw_data:/home/node/.openclaw
      - ./src/openclaw.json:/seed/openclaw.json:ro

  openclaw-gateway:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    restart: unless-stopped
    init: true
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    command: [ "node", "dist/index.js", "gateway", "--allow-unconfigured", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789" ]
    ports:
      - $W9_HTTP_PORT_SET:18789
      - $W9_BRIDGE_PORT_SET:18790
    env_file: .env
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_TOKEN=$W9_POWER_PASSWORD
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND}
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
    volumes:
      - openclaw_data:/home/node/.openclaw
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openclaw-cli:
    image: $W9_REPO:$W9_VERSION
    container_name: ${W9_ID}-cli
    network_mode: "service:openclaw-gateway"
    profiles:
      - cli
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_TOKEN=$W9_POWER_PASSWORD
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND}
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      - BROWSER=echo
    volumes:
      - openclaw_data:/home/node/.openclaw
    stdin_open: true
    tty: true
    init: true
    entrypoint: [ "node", "dist/index.js" ]
    depends_on:
      - openclaw-gateway

volumes:
  openclaw_data:


networks:
  default:
    name: ${W9_NETWORK}
    external: true
