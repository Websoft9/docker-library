services:
  umami:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:3000" # Web Console
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgresql:
    image: postgres:${W9_DB_VERSION}-alpine
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${W9_POWER_PASSWORD}
      POSTGRES_UMAMI_PASSWORD: ${W9_RCODE}
    volumes:
      - postgresql:/var/lib/postgresql/data
      - ./src/postgresql_init.sh:/docker-entrypoint-initdb.d/postgresql_init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  postgresql:
    driver: local
