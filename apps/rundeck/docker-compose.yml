services:

  rundeck:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - ${W9_HTTP_PORT_SET}:4440 # Web Console
    env_file: .env
    volumes:
      - rundeck:/home/rundeck/server/data

volumes:
  rundeck:
    
networks:
  default:
    name: ${W9_NETWORK}
    external: true
