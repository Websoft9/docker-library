services:

  ffmpeg:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    # Toolbox container: stays alive so users can run ffmpeg jobs via exec
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    env_file: .env
    environment:
      - PUID=65534
      - PGID=65534
      - TZ=Asia/Shanghai
    volumes:
      - media:/media

volumes:
  media:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
