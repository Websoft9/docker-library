services:
  gitea:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${W9_HTTP_PORT_SET}:3000" # Web UI
      - "${W9_SSH_PORT_SET}:${W9_SSH_PORT_SET}" # Git SSH
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  gitea:
