# Websoft9 Gateway (Nginx Proxy Manager) advanced config.
# The platform reads this file from src/nginx-proxy.conf and injects it into the
# Proxy Host server{} block. It is NOT mounted into any container, so
# docker-compose.yml does not reference it.
#
# Home Assistant rejects every request that carries X-Forwarded-For / X-Real-IP
# unless the proxy IP is listed under trusted proxies (Settings > System >
# Network; the YAML `http:` block is ignored since 2026.8). The Websoft9 Gateway
# adds those headers, so direct port access works while a bound domain fails with
# HTTP 400. Clearing the forwarded headers here keeps Home Assistant reachable
# behind the gateway without any per-user setup; the Upgrade/Connection
# directives keep the frontend WebSocket connection alive.

location / {
    proxy_pass $forward_scheme://$server:$port$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
