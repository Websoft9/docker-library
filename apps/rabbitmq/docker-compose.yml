services:

  rabbitmq:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "4369:4369" # Erlang distribution (epmd)
      - "5672:5672" # AMQP 0-9-1
      - "15672:15672" # Management UI
    env_file: .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./src/rabbitmq.conf:/etc/rabbitmq/conf.d/99-websoft9.conf:ro

volumes:
  rabbitmq_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
