# RabbitMQ custom configuration.
#
# This file is mounted read-only to /etc/rabbitmq/conf.d/99-websoft9.conf and is
# merged after the image defaults in /etc/rabbitmq/conf.d/10-defaults.conf.
# Keep the numeric 99- prefix so this file is loaded last.
#
# Docs: https://www.rabbitmq.com/docs/configure

# Example: default virtual host
# default_vhost = /

# Example: restrict the guest user to localhost only
# loopback_users.guest = true

# Example: memory high watermark
# vm_memory_high_watermark.relative = 0.6

# Example: log level
# log.file.level = info

# Example: TLS listener
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
# ssl_options.certfile = /etc/rabbitmq/certs/server.pem
# ssl_options.keyfile = /etc/rabbitmq/certs/server-key.pem
