services:
  uptime-kuma:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:3001" # Web Console
    env_file: .env
    volumes:
      - uptime-kuma:/app/data

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  uptime-kuma:
