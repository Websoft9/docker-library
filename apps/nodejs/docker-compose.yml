services:
  node:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file: .env
    working_dir: /usr/src/app
    volumes:
      - app:/usr/src/app
      - ./src/cmd.sh:/usr/src/app/cmd.sh
    command: /bin/bash /usr/src/app/cmd.sh
    environment:
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # Web Console
    tty: true

volumes:
  app:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
