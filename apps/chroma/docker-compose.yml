services:
  chromadb:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    volumes:
      - chroma_data:/data
    ports:
      - "${W9_HTTP_PORT_SET}:8000" # Chroma API
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; printf \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  chroma_data:
