services:
  xwiki:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:8080" # Web Console
    volumes:
      - xwiki:/usr/local/xwiki
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/bin/view/Main/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  db:
    image: mysql:${W9_DB_VERSION}
    container_name: ${W9_ID}-mysql
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_bin"
      - "--explicit-defaults-for-timestamp=1"
    volumes:
      - mysql:/var/lib/mysql
      - ./src/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_DATABASE: xwiki
      MYSQL_USER: xwiki
      MYSQL_PASSWORD: ${W9_POWER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${W9_POWER_PASSWORD}

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  xwiki:
  mysql:
