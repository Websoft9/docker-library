services:
  tensorflow:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:8888" # Jupyter Notebook
      - "${W9_GUI_PORT_SET}:6006" # TensorBoard
    env_file: .env
    volumes:
      - tensorflow:/tf/notebooks

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  tensorflow:
