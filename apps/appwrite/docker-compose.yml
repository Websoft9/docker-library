        - 'curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://localhost/v1/health >/dev/null'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite_builds:/storage/builds
      - appwrite_functions:/storage/functions
      - appwrite_sites:/storage/sites
