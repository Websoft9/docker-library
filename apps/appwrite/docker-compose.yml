      - OPR_EXECUTOR_STORAGE_WASABI_BUCKET=${_APP_STORAGE_WASABI_BUCKET}

  mariadb:
    image: mariadb:10.11
    container_name: ${W9_ID}-mariadb
    restart: unless-stopped
    volumes:
      - appwrite_mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${_APP_DB_ROOT_PASS}
      - MYSQL_DATABASE=${_APP_DB_SCHEMA}
      - MYSQL_USER=${_APP_DB_USER}
      - MYSQL_PASSWORD=${_APP_DB_PASS}
      - MARIADB_AUTO_UPGRADE=1
    command:
      - mysqld
      - --innodb-flush-method=fsync
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:${W9_DB_VERSION}
    container_name: ${W9_ID}-mongodb
    restart: on-failure:3
    volumes:
      - appwrite_mongodb:/data/db
      - appwrite_mongodb_keyfile:/data/keyfile
      - ./src/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./src/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${_APP_DB_ROOT_PASS}
      - MONGO_INITDB_DATABASE=${_APP_DB_SCHEMA}
      - MONGO_INITDB_USERNAME=${_APP_DB_USER}
      - MONGO_INITDB_PASSWORD=${_APP_DB_PASS}
    entrypoint:
      - /bin/bash
      - /mongo-entrypoint.sh
    healthcheck:
      test: |
        bash -c "
          mongosh -u root -p ${_APP_DB_ROOT_PASS} --authenticationDatabase admin --quiet --eval \
            \"try {\n              const hello = db.adminCommand({hello: 1});\n              if (hello.isWritablePrimary && hello.setName === 'rs0') {\n                quit(0);\n              }\n            } catch (e) {}\n\n            try {\n              rs.initiate({_id: 'rs0', members: [{_id: 0, host: '${W9_ID}-mongodb:27017'}]});\n            } catch (e) {}\n\n            quit(1);\" 2>/dev/null
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgresql:
    image: pgvector/pgvector:pg18
    container_name: ${W9_ID}-postgresql
    volumes:
      - appwrite_postgresql:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${_APP_DB_SCHEMA}
      - POSTGRES_USER=${_APP_DB_USER}
      - POSTGRES_PASSWORD=${_APP_DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${_APP_DB_USER} -d ${_APP_DB_SCHEMA}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off

  appwrite-embedding:
    image: appwrite/embedding:0.1.0
    container_name: ${W9_ID}-embedding
    restart: unless-stopped
    environment:
      EMBEDDING_MODELS: ${_APP_EMBEDDING_MODELS:-nomic-embed-text}
    volumes:
      - appwrite_models:/home/embedder/models

  redis:
    image: redis:7.4-alpine
    container_name: ${W9_ID}-redis
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "5"
    volumes:
      - appwrite_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  appwrite_mariadb:
  appwrite_mongodb:
  appwrite_mongodb_keyfile:
  appwrite_postgresql:
  appwrite_redis:
  appwrite_cache:
  appwrite_uploads:
  appwrite_imports:
  appwrite_certificates:
  appwrite_functions:
  appwrite_sites:
  appwrite_builds:
  appwrite_config:
  appwrite_models:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
