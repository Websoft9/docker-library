services:
  strapi:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:1337" # Web Console
    volumes:
      - strapi_data:/opt/app/.tmp
      - strapi_uploads:/opt/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1337/_health', (res) => process.exit(res.statusCode === 200 || res.statusCode === 204 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  strapi_data:
  strapi_uploads:
