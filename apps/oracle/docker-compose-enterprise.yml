services:
  oracle:
    image: container-registry.oracle.com/database/enterprise:${W9_VERSION}
    container_name: ${W9_ID}
    env_file: .env
    volumes:
      - data:/opt/oracle/oradata
      - startup:/opt/oracle/scripts/startup
      - setup:/opt/oracle/scripts/setup
    ports:
      - "1521:1521" # Oracle database listener (SQL*Net)
      - "5500:5500" # Oracle Enterprise Manager console
    restart: unless-stopped


networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  data:
  startup:
  setup:
