services:
  oracleex:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    env_file: .env
    volumes:
      - data:/opt/oracle/oradata
    ports:
      - "${W9_DB_PORT_SET}:1521" # Oracle database listener (SQL*Net)
      - "${W9_HTTPS_PORT_SET}:5500" # Oracle Enterprise Manager (EM) console
    restart: unless-stopped

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  data:
