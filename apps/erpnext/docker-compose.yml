# old image: https://hub.docker.com/r/frappe/erpnext-worker/tags
# new image: https://hub.docker.com/r/frappe/erpnext/tags
# docs: https://github.com/frappe/frappe_docker/blob/main/pwd.yml

services:
  backend:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-backend
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  configurator:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-configurator
    restart: none
    entrypoint:
      - bash
      - -c
    # add redis_socketio for backward compatibility
    command:
      - >
        ls -1 apps > sites/apps.txt; bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache "redis://$$REDIS_CACHE"; bench set-config -g redis_queue "redis://$$REDIS_QUEUE"; bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"; bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: $W9_ID-mariadb
      DB_PORT: "3306"
      REDIS_CACHE: $W9_ID-redis-cache:6379
      REDIS_QUEUE: $W9_ID-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-create-site
    restart: none
    env_file:
      - .env
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./src/create-site.sh:/usr/local/bin/create-site.sh
      - ./src/hrms:/opt/hrms-src:ro
    entrypoint:
      - bash
      - /usr/local/bin/create-site.sh

  mariadb:
    image: mariadb:$W9_DB_VERSION
    container_name: $W9_ID-mariadb
    healthcheck:
      test: mysqladmin ping -h localhost --password=$W9_POWER_PASSWORD
      interval: 1s
      retries: 15
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: $W9_POWER_PASSWORD
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    depends_on:
      create-site:
        condition: service_completed_successfully
      websocket:
        condition: service_started
    restart: unless-stopped
    env_file:
      - .env
    command:
      - bash
      - -c
      - >
        set -e; cd /home/frappe/frappe-bench; if [ -d apps/hrms/hrms/public ]; then
          mkdir -p sites/assets/hrms;
          cp -a apps/hrms/hrms/public/. sites/assets/hrms/;
        fi; exec nginx-entrypoint.sh
    environment:
      BACKEND: $W9_ID-backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: $W9_ID-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - $W9_HTTP_PORT_SET:8080

  queue-long:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-queue-long
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-short:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-queue-short
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  redis-queue:
    image: redis:6.2-alpine
    container_name: $W9_ID-redis-queue
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    container_name: $W9_ID-redis-cache
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  scheduler:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-scheduler
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID-websocket
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  apps:
  env:
  db-data:
  redis-queue-data:
  redis-cache-data:
  sites:
  logs:


networks:
  default:
    name: $W9_NETWORK
    external: true
