services:
  activepieces:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:80" # Web Console
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - activepieces_cache:/usr/src/app/cache

  worker:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-worker
    restart: unless-stopped
    depends_on:
      - activepieces
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://activepieces
    volumes:
      - activepieces_cache:/usr/src/app/cache

  postgres:
    image: pgvector/pgvector:${W9_DB_VERSION}
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0
    container_name: ${W9_ID}-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  activepieces_cache:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
