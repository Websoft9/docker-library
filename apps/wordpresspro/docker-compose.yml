services:
  wordpress:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-wordpress
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: 10m
    env_file: .env
    environment:
      W9_URL: ${W9_URL}
      W9_URL_REPLACE: ${W9_URL_REPLACE}
    depends_on:
      - mysql
      - redis
    volumes:
      - wordpress:/var/www/html
      - ./src/php_exra.ini:/usr/local/etc/php/conf.d/php_exra.ini
      - ./src/websoft9-url.php:/usr/local/share/websoft9-url.php:ro
      
  mysql:
    image: mysql:${W9_DB_VERSION}
    container_name: ${W9_ID}-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb_log_buffer_size=30M
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${W9_ID}
      MYSQL_USER: ${W9_ID}
      MYSQL_PASSWORD: ${W9_POWER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${W9_POWER_PASSWORD}

  redis:
    image: redis:7.4-alpine
    container_name: ${W9_ID}-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    volumes:
      - redis_data:/data

  redis-bootstrap:
    image: wordpress:cli-2.12-php8.4
    container_name: ${W9_ID}-redis-bootstrap
    user: root
    restart: on-failure
    env_file: .env
    depends_on:
      - wordpress
      - redis
    volumes:
      - wordpress:/var/www/html
      - ./src/configure-redis.sh:/usr/local/bin/configure-redis.sh:ro
      - ./src/websoft9-url.php:/usr/local/share/websoft9-url.php:ro
    command:
      - /bin/sh
      - /usr/local/bin/configure-redis.sh
      
  varnish:
    image: varnish:latest
    container_name: ${W9_ID}
    restart: unless-stopped
    user: root
    ports:
      - "${W9_HTTP_PORT_SET}:80" # Web Console
    env_file: .env
    depends_on:
      - wordpress
    volumes:
      - ./src/default.vcl.template:/etc/varnish/default.vcl.template:ro
      - ./src/run-varnish.sh:/usr/local/bin/run-varnish.sh:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    command: ["/bin/sh", "/usr/local/bin/run-varnish.sh"]

volumes:
  wordpress:
  mysql_data:
  redis_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
