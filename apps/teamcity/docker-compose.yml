services:
  teamcity-server:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    hostname: ${W9_RCODE}
    depends_on:
      - teamcity-mysql
    env_file: .env
    ports:
      - "${W9_HTTP_PORT_SET}:8111" # Web Console
    volumes:
      - teamcity_data:/data/teamcity_server/datadir
      - teamcity_logs:/opt/teamcity/logs
      - teamcity_temp:/opt/teamcity/temp

  teamcity-agent:
    image: jetbrains/teamcity-agent:${W9_VERSION}
    container_name: ${W9_ID}-agent
    restart: unless-stopped
    privileged: true
    environment:
      - SERVER_URL=${W9_RCODE}:8111  # TeamCity hostname must not contain underscores
      - AGENT_NAME=${W9_ID}-agent
      - OWN_PORT=9090
      - DOCKER_IN_DOCKER=start
    volumes:
      - agent_conf:/data/teamcity_agent/conf
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_work:/opt/buildagent/work
      - agent_temp:/opt/buildagent/temp
      - agent_tools:/opt/buildagent/tools
      - agent_plugins:/opt/buildagent/plugins
      - agent_system:/opt/buildagent/system
      - agent_logs:/opt/buildagent/logs
      - agent_docker:/var/lib/docker

  teamcity-mysql:
    image: mysql:${W9_DB_VERSION}
    container_name: ${W9_ID}-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${W9_POWER_PASSWORD}
      - MYSQL_DATABASE=teamcity
      - MYSQL_USER=teamcity
      - MYSQL_PASSWORD=${W9_POWER_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  teamcity_logs:
  teamcity_data:
  teamcity_temp:
  mysql_data:
  agent_system:
  agent_work:
  agent_logs:
  agent_temp:
  agent_tools:
  agent_conf:
  agent_plugins:
  agent_docker:
