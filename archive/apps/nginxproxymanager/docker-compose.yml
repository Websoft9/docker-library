services:
  app:
    image: ${W9_REPO}:${W9_VERSION}
    restart: unless-stopped
    container_name: ${W9_ID}
    env_file:
      - .env
    ports:
      - "${W9_HTTP_PORT_SET}:81" # Web Console
      - "${W9_HTTPS_PORT_SET}:443" # HTTPS Proxy
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
 
networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  nginx_data:
  nginx_letsencrypt:
