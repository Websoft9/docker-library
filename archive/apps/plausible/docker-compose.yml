services:
  plausible_db:
    image: postgres:${W9_DB_VERSION}-alpine
    container_name: ${W9_ID}-postgresql
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: plausible_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${W9_POWER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plausible_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: ${W9_ID}-clickhouse
    restart: unless-stopped
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./src/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./src/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  plausible:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      - "${W9_HTTP_PORT_SET}:8000" # Web Console
    env_file:
      - .env
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  db-data:
  event-data:
  event-logs:
  plausible-data:
