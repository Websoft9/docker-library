services:
  ocis-init:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-init
    restart: "no"
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /etc/ocis/ocis.yaml ]; then
          echo "[ocis-init] config already exists, skipping"
        else
          echo "[ocis-init] generating ocis.yaml"
          ocis init --insecure true
        fi
    volumes:
      - owncloud-config:/etc/ocis

  owncloud:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    restart: unless-stopped
    depends_on:
      ocis-init:
        condition: service_completed_successfully
    ports:
      - "${W9_HTTPS_PORT_SET}:9200" # HTTPS Web Console
    volumes:
      - owncloud-config:/etc/ocis
      - owncloud-data:/var/lib/ocis
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1:9200/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  owncloud-config:
  owncloud-data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
