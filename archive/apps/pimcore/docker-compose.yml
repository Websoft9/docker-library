services:
  nginx:
    image: nginx:stable-alpine
    container_name: ${W9_ID}
    restart: unless-stopped
    ports:
      - "${W9_HTTP_PORT_SET}:80" # Web Console
    volumes:
      - pimcore:/var/www/html:ro
      - ./src/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  php:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}-php
    restart: unless-stopped
    env_file: .env
    environment:
      COMPOSER_MEMORY_LIMIT: -1
    command: sh -c "/usr/local/bin/bootstrap.sh && exec php-fpm"
    volumes:
      - pimcore:/var/www/html
      - ./src/bootstrap.sh:/usr/local/bin/bootstrap.sh:ro
      - ./src/messenger.yaml:/websoft9-src/messenger.yaml:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  mariadb:
    image: mariadb:${W9_DB_VERSION}
    container_name: ${W9_ID}-mariadb
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --innodb-file-per-table=1
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${W9_POWER_PASSWORD}
      MYSQL_DATABASE: ${PIMCORE_DB_NAME}
      MYSQL_USER: ${PIMCORE_DB_USER}
      MYSQL_PASSWORD: ${PIMCORE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u${PIMCORE_DB_USER} -p${PIMCORE_DB_PASSWORD} ${PIMCORE_DB_NAME} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: ${W9_ID}-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", ""]

volumes:
  pimcore:
  mariadb:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
