services:
  appsmith:
    image: $W9_REPO:$W9_VERSION
    container_name: $W9_ID
    ports:
      - "$W9_HTTP_PORT_SET:$W9_HTTP_PORT"
    volumes:
      - appsmith:/appsmith-stacks
    restart: unless-stopped
    env_file: .env

networks:
  default:
    name: ${W9_NETWORK}
    external: true

volumes:
  appsmith:
