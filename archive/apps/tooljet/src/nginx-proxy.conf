# Websoft9 Gateway (Nginx Proxy Manager) advanced config.
# The platform reads this file from src/nginx-proxy.conf and injects it into the
# Proxy Host server{} block. It is NOT mounted into any container.
# limit_req/limit_conn zones are defined platform-side in /data/nginx/custom/http.conf.

# Proxy buffering baseline.
proxy_buffers 4 512k;
proxy_buffer_size 256k;
proxy_busy_buffers_size 512k;
client_max_body_size 50m;

# Client concurrency / rate limits from the platform access-control docs.
limit_req zone=w9_global_limit burst=500 nodelay;
limit_req zone=w9_limit_req_zone burst=300 nodelay;
limit_conn w9_limit_conn_zone 30;
