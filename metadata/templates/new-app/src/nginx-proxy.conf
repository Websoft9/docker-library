# Websoft9 Gateway (Nginx Proxy Manager) advanced config reference.
#
# The platform reads this file from the app package as:
#   src/nginx-proxy.conf
# and injects its content into the Proxy Host server{} block in Nginx Proxy
# Manager. It is NOT mounted into the app container, so docker-compose.yml does
# not reference it.
#
# Only server-context directives belong here. http-context directives such as
# limit_req_zone / limit_conn_zone are defined platform-side and must not be
# declared in this file.
#
# If you override the default location /, keep the forward proxy line so traffic
# still reaches the app:
#   proxy_pass $forward_scheme://$server:$port$request_uri;

# Example: align the gateway upload limit and proxy buffers with the app
# client_max_body_size 50m;
# proxy_buffers 4 512k;
# proxy_buffer_size 256k;
# proxy_busy_buffers_size 512k;

# Example: proxy a sub-path to a second service in the same compose
# location /console {
#     proxy_pass http://$server:8080;
#     proxy_http_version 1.1;
#     proxy_set_header Host $http_host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
